<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="100%" height="100%">
  <defs>
    <style>
      .font-mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, Courier, monospace; }
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

      @keyframes retinaRotate {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      @keyframes eegScroll {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -180; }
      }

      @keyframes targetBoxPulse {
        0%, 100% { stroke: #00d2d3; opacity: 0.9; }
        50% { stroke: #0f62fe; opacity: 0.4; }
      }

      @keyframes synapseFlashes {
        0%, 100% { fill: #00d2d3; r: 3.5; }
        50% { fill: #a855f7; r: 5.5; filter: drop-shadow(0 0 4px #a855f7); }
      }

      .retina-ring { transform-origin: 120px 115px; animation: retinaRotate 10s linear infinite; }
      .eeg-wave { stroke-dasharray: 8 4; animation: eegScroll 2s linear infinite; }
      .retina-box { animation: targetBoxPulse 2.5s ease-in-out infinite; }
      .synapse-dot { animation: synapseFlashes 2s ease-in-out infinite; }

      @media (prefers-reduced-motion: reduce) {
        .retina-ring, .eeg-wave, .retina-box, .synapse-dot { animation: none; }
      }
    </style>

    <linearGradient id="eeg-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d2d3" />
      <stop offset="50%" stop-color="#42be65" />
      <stop offset="100%" stop-color="#0f62fe" />
    </linearGradient>

    <radialGradient id="retina-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00d2d3" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#080c14" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Container Box -->
  <rect width="800" height="220" rx="12" fill="#080c14" stroke="#1c283f" stroke-width="1.5" />

  <!-- Top Title Strip -->
  <rect width="800" height="32" rx="12" fill="#0d1527" />
  <rect x="0" y="22" width="800" height="10" fill="#0d1527" />
  <line x1="0" y1="32" x2="800" y2="32" stroke="#1c283f" stroke-width="1" />

  <g transform="translate(24, 21)">
    <circle cx="6" cy="0" r="4" fill="#00d2d3" />
    <text x="18" y="4" fill="#00d2d3" font-size="11" font-weight="700" class="font-mono" letter-spacing="1">👁️ NEURAL-LINK HUD &amp; BIOMETRIC CLEARANCE MATRIX</text>
  </g>
  <text x="776" y="21" text-anchor="end" fill="#42be65" font-size="10" font-weight="700" class="font-mono">BIO-AUTH: 99.98% [LEVEL 5 CLEARANCE]</text>

  <!-- LEFT: RETINA TARGET ACQUISITION (Center: 120, 115) -->
  <g>
    <circle cx="120" cy="115" r="62" fill="url(#retina-glow)" />
    
    <!-- Rotating Circular Scale -->
    <circle cx="120" cy="115" r="58" fill="none" stroke="#1c283f" stroke-width="1.2" />
    <circle cx="120" cy="115" r="46" fill="none" stroke="#00d2d3" stroke-width="1.5" stroke-dasharray="14 10" class="retina-ring" opacity="0.8" />
    <circle cx="120" cy="115" r="32" fill="none" stroke="#1c283f" stroke-width="0.8" stroke-dasharray="3 3" />
    
    <!-- Targeting Crosshair Lines -->
    <line x1="45" y1="115" x2="195" y2="115" stroke="#1c283f" stroke-width="1" />
    <line x1="120" y1="40" x2="120" y2="190" stroke="#1c283f" stroke-width="1" />

    <!-- Corner Target Brackets -->
    <g class="retina-box">
      <path d="M 98 93 L 98 83 L 108 83" fill="none" stroke-width="1.8" />
      <path d="M 142 93 L 142 83 L 132 83" fill="none" stroke-width="1.8" />
      <path d="M 98 137 L 98 147 L 108 147" fill="none" stroke-width="1.8" />
      <path d="M 142 137 L 142 147 L 132 147" fill="none" stroke-width="1.8" />
    </g>

    <!-- Center Retina Core Lock -->
    <circle cx="120" cy="115" r="5" fill="#00d2d3" />
    <circle cx="120" cy="115" r="1.8" fill="#ffffff" />
    
    <text x="120" y="174" text-anchor="middle" fill="#42be65" font-size="8.5" font-weight="700" class="font-mono">TARGET LOCKED</text>
  </g>

  <!-- VERTICAL DIVIDER -->
  <line x1="225" y1="32" x2="225" y2="220" stroke="#1c283f" stroke-width="1" />

  <!-- RIGHT: EEG WAVEFORM & SYNAPSE TELEMETRY -->
  <g transform="translate(245, 46)">
    <!-- BLOCK 1: EEG BRAINWAVE OSCILLOGRAPH -->
    <g transform="translate(0, 0)">
      <rect width="530" height="66" rx="6" fill="#0d1527" stroke="#1c283f" stroke-width="1" />
      
      <text x="14" y="16" fill="#64748b" font-size="9.5" font-weight="700" class="font-mono">EEG TELEMETRY // GAMMA &amp; ALPHA COGNITIVE SYNCHRONY (40Hz)</text>
      <text x="440" y="16" fill="#00d2d3" font-size="9" font-weight="700" class="font-mono">SYNC: 100%</text>

      <!-- EEG Wave Grid -->
      <line x1="14" y1="42" x2="516" y2="42" stroke="#162238" stroke-width="0.8" />
      
      <!-- Animated EEG Waveform -->
      <path d="M 14 42 Q 35 42, 45 20 T 60 56 T 75 42 T 110 42 T 120 12 T 135 62 T 150 42 T 190 42 T 205 24 T 220 54 T 235 42 T 280 42 T 295 16 T 310 60 T 325 42 T 370 42 T 385 22 T 400 56 T 415 42 T 460 42 T 475 14 T 490 62 T 516 42"
            fill="none" stroke="url(#eeg-grad)" stroke-width="1.8" class="eeg-wave" />
      
      <text x="14" y="58" fill="#64748b" font-size="8" class="font-mono">LATENCY: 0.18ms &#8226; FOCUS STATE: HYPER-PRODUCTIVE &#8226; ERROR BUDGET: 0.00%</text>
    </g>

    <!-- BLOCK 2: NEURAL SYNAPSE NETWORK BUS -->
    <g transform="translate(0, 74)">
      <rect width="530" height="84" rx="6" fill="#0d1527" stroke="#1c283f" stroke-width="1" />
      
      <!-- Identity & Trajectory Badges -->
      <g transform="translate(14, 14)">
        <text x="0" y="12" fill="#cbd5e1" font-size="10.5" font-weight="700" class="font-mono">NAME: <tspan fill="#ffffff">Gabriel Silva</tspan></text>
        <text x="0" y="30" fill="#cbd5e1" font-size="10.5" font-weight="700" class="font-mono">ROLE: <tspan fill="#0f62fe">Apprentice @ IBM Brasil</tspan></text>
        <text x="0" y="48" fill="#cbd5e1" font-size="10" font-weight="600" class="font-mono">HANDLE: <tspan fill="#00d2d3">@crtooy-codes</tspan> &#8226; OS: <tspan fill="#42be65">CRTOOY KERNEL v4</tspan></text>
      </g>

      <!-- Synapse Graphic Connection on Right -->
      <g transform="translate(290, 10)">
        <!-- Neural Synapses with Pulsing Dots -->
        <line x1="20" y1="20" x2="80" y2="10" stroke="#1c283f" stroke-width="1" />
        <line x1="20" y1="20" x2="80" y2="40" stroke="#1c283f" stroke-width="1" />
        <line x1="80" y1="10" x2="150" y2="25" stroke="#1c283f" stroke-width="1" />
        <line x1="80" y1="40" x2="150" y2="25" stroke="#1c283f" stroke-width="1" />
        <line x1="150" y1="25" x2="210" y2="25" stroke="#1c283f" stroke-width="1" />

        <circle cx="20" cy="20" r="4" fill="#00d2d3" class="synapse-dot" />
        <circle cx="80" cy="10" r="4" fill="#0f62fe" class="synapse-dot" style="animation-delay: 0.4s;" />
        <circle cx="80" cy="40" r="4" fill="#42be65" class="synapse-dot" style="animation-delay: 0.8s;" />
        <circle cx="150" cy="25" r="4" fill="#a855f7" class="synapse-dot" style="animation-delay: 1.2s;" />
        <circle cx="210" cy="25" r="5" fill="#ff9400" class="synapse-dot" style="animation-delay: 1.6s;" />

        <text x="20" y="38" text-anchor="middle" fill="#64748b" font-size="7" class="font-mono">INPUT</text>
        <text x="80" y="58" text-anchor="middle" fill="#64748b" font-size="7" class="font-mono">AI_AGENT</text>
        <text x="150" y="44" text-anchor="middle" fill="#64748b" font-size="7" class="font-mono">IBM_CORE</text>
        <text x="210" y="44" text-anchor="middle" fill="#64748b" font-size="7" class="font-mono">OUTPUT</text>
      </g>
    </g>
  </g>

  <!-- Bottom Line -->
  <line x1="24" y1="202" x2="776" y2="202" stroke="#1c283f" stroke-width="1" />
</svg>
