<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 650 40" width="100%" height="100%">
  <defs>
    <style>
      .tagline {
        font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, Courier, monospace;
        font-size: 15px;
        font-weight: 600;
        fill: #78a9ff;
        letter-spacing: 1.5px;
        text-anchor: middle;
      }

      .cursor {
        fill: #00d2d3;
        font-weight: 700;
        animation: blink 0.9s infinite;
      }

      @keyframes blink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
    </style>
  </defs>

  <text x="325" y="25" class="tagline">
    Building. Learning. Automating. Exploring AI.<tspan class="cursor"> _</tspan>
  </text>
</svg>
