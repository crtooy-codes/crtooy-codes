<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <style>
      .font-mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, Courier, monospace; }
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

      @keyframes barGlow {
        0%, 100% { opacity: 0.85; filter: drop-shadow(0 0 2px #00d2d3); }
        50% { opacity: 1; filter: drop-shadow(0 0 6px #00d2d3); }
      }

      @keyframes pulseNode {
        0%, 100% { r: 3.5; opacity: 0.8; }
        50% { r: 5; opacity: 1; filter: drop-shadow(0 0 4px #42be65); }
      }

      .glow-bar { animation: barGlow 3s ease-in-out infinite; }
      .node-pulse { animation: pulseNode 2.5s ease-in-out infinite; }

      @media (prefers-reduced-motion: reduce) {
        .glow-bar, .node-pulse { animation: none; }
      }
    </style>

    <linearGradient id="bar-grad-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f62fe" />
      <stop offset="70%" stop-color="#4589ff" />
      <stop offset="100%" stop-color="#00d2d3" />
    </linearGradient>

    <linearGradient id="bar-grad-2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8a3ffc" />
      <stop offset="70%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#d946ef" />
    </linearGradient>

    <linearGradient id="bar-grad-3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0072c3" />
      <stop offset="70%" stop-color="#00d2d3" />
      <stop offset="100%" stop-color="#42be65" />
    </linearGradient>

    <linearGradient id="bar-grad-4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff7eb6" />
      <stop offset="70%" stop-color="#ff9400" />
      <stop offset="100%" stop-color="#fddc69" />
    </linearGradient>
  </defs>

  <!-- Container Box -->
  <rect width="800" height="240" rx="12" fill="#080c14" stroke="#1c283f" stroke-width="1.5" />

  <!-- Top Title Bar -->
  <rect width="800" height="32" rx="12" fill="#0d1527" />
  <rect x="0" y="22" width="800" height="10" fill="#0d1527" />
  <line x1="0" y1="32" x2="800" y2="32" stroke="#1c283f" stroke-width="1" />

  <text x="24" y="21" fill="#00d2d3" font-size="11" font-weight="700" class="font-mono" letter-spacing="1">⚡ CAPABILITIES &amp; ENGINEERING MATRIX</text>
  <text x="776" y="21" text-anchor="end" fill="#64748b" font-size="10" font-weight="600" class="font-mono">TELEMETRY // VERIFIED EXPERTISE</text>

  <!-- 4-BLOCK GRID (2 Columns x 2 Rows) -->

  <!-- QUADRANT 1: SYSTEMS & STRICT RUNTIMES (Top Left) -->
  <g transform="translate(24, 46)">
    <rect width="365" height="74" rx="6" fill="#0d1527" stroke="#1c283f" stroke-width="1" />
    <circle cx="16" cy="18" r="4" fill="#00d2d3" />
    <text x="28" y="21" fill="#cbd5e1" font-size="10.5" font-weight="700" class="font-mono">💻 SYSTEMS &amp; STRICT RUNTIMES</text>
    <text x="16" y="40" fill="#94a3b8" font-size="9.5" class="font-mono">TypeScript 5.7 Strict • Node.js 22 • Kotlin • Java • Linux</text>
    
    <!-- Progress Bar & Indicator -->
    <rect x="16" y="52" width="333" height="5" rx="2.5" fill="#162238" />
    <rect x="16" y="52" width="310" height="5" rx="2.5" fill="url(#bar-grad-1)" class="glow-bar" />
    <text x="330" y="66" fill="#00d2d3" font-size="8.5" font-weight="700" class="font-mono">94%</text>
  </g>

  <!-- QUADRANT 2: APPLIED AI & AGENTIC WORKFLOWS (Top Right) -->
  <g transform="translate(411, 46)">
    <rect width="365" height="74" rx="6" fill="#0d1527" stroke="#1c283f" stroke-width="1" />
    <circle cx="16" cy="18" r="4" fill="#a855f7" />
    <text x="28" y="21" fill="#cbd5e1" font-size="10.5" font-weight="700" class="font-mono">🤖 APPLIED AI &amp; AGENT WORKFLOWS</text>
    <text x="16" y="40" fill="#94a3b8" font-size="9.5" class="font-mono">Agent Architectures • Local LLMs • Tool-Use • Automation</text>
    
    <!-- Progress Bar & Indicator -->
    <rect x="16" y="52" width="333" height="5" rx="2.5" fill="#162238" />
    <rect x="16" y="52" width="285" height="5" rx="2.5" fill="url(#bar-grad-2)" class="glow-bar" />
    <text x="330" y="66" fill="#a855f7" font-size="8.5" font-weight="700" class="font-mono">86%</text>
  </g>

  <!-- QUADRANT 3: SECURITY & NETWORK LAB (Bottom Left) -->
  <g transform="translate(24, 128)">
    <rect width="365" height="74" rx="6" fill="#0d1527" stroke="#1c283f" stroke-width="1" />
    <circle cx="16" cy="18" r="4" fill="#42be65" />
    <text x="28" y="21" fill="#cbd5e1" font-size="10.5" font-weight="700" class="font-mono">🛡️ DEFENSIVE SECURITY &amp; SECOPS</text>
    <text x="16" y="40" fill="#94a3b8" font-size="9.5" class="font-mono">Android Root Chroot • Nmap Recon • Protocol Audit • OWASP</text>
    
    <!-- Progress Bar & Indicator -->
    <rect x="16" y="52" width="333" height="5" rx="2.5" fill="#162238" />
    <rect x="16" y="52" width="298" height="5" rx="2.5" fill="url(#bar-grad-3)" class="glow-bar" />
    <text x="330" y="66" fill="#42be65" font-size="8.5" font-weight="700" class="font-mono">90%</text>
  </g>

  <!-- QUADRANT 4: 3D GRAPHICS & WEB AUDIO (Bottom Right) -->
  <g transform="translate(411, 128)">
    <rect width="365" height="74" rx="6" fill="#0d1527" stroke="#1c283f" stroke-width="1" />
    <circle cx="16" cy="18" r="4" fill="#ff9400" />
    <text x="28" y="21" fill="#cbd5e1" font-size="10.5" font-weight="700" class="font-mono">🎮 3D GRAPHICS &amp; PROCEDURAL AUDIO</text>
    <text x="16" y="40" fill="#94a3b8" font-size="9.5" class="font-mono">Three.js • WebGL Shaders • Web Audio API • React 18 • Vite</text>
    
    <!-- Progress Bar & Indicator -->
    <rect x="16" y="52" width="333" height="5" rx="2.5" fill="#162238" />
    <rect x="16" y="52" width="275" height="5" rx="2.5" fill="url(#bar-grad-4)" class="glow-bar" />
    <text x="330" y="66" fill="#ff9400" font-size="8.5" font-weight="700" class="font-mono">84%</text>
  </g>

  <!-- BOTTOM STATUS FOOTER -->
  <line x1="24" y1="210" x2="776" y2="210" stroke="#1c283f" stroke-width="1" />
  <g transform="translate(24, 226)">
    <circle cx="6" cy="0" r="3.5" fill="#42be65" class="node-pulse" />
    <text x="16" y="3" fill="#64748b" font-size="9.5" class="font-mono">QUALITY GATE: <tspan fill="#42be65" font-weight="700">100% DETERMINISTIC</tspan> &#8226; ARCHITECTURE: <tspan fill="#00d2d3" font-weight="700">STRICT TS &amp; CLEAN ARCH</tspan> &#8226; STATUS: <tspan fill="#cbd5e1">SCALABLE</tspan></text>
  </g>
</svg>
