<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 130" width="100%" height="100%">
  <defs>
    <style>
      .font-mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }

      @keyframes wavePulse {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -320; }
      }
      @keyframes blinkPill {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.4; }
      }

      .wave-path {
        stroke-dasharray: 12 6;
        animation: wavePulse 3s linear infinite;
      }
      .live-pill {
        animation: blinkPill 2s ease-in-out infinite;
      }

      @media (prefers-reduced-motion: reduce) {
        .wave-path, .live-pill { animation: none; }
      }
    </style>

    <linearGradient id="wave-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f62fe" />
      <stop offset="50%" stop-color="#00d2d3" />
      <stop offset="100%" stop-color="#42be65" />
    </linearGradient>
  </defs>

  <!-- Container Box -->
  <rect width="800" height="130" rx="10" fill="#080c14" stroke="#1c283f" stroke-width="1.2" />

  <!-- Header Strip -->
  <rect width="800" height="26" rx="10" fill="#0d1527" />
  <text x="24" y="17" fill="#64748b" font-size="10.5" font-weight="700" class="font-mono">CRTOOY ENGINE TELEMETRY // REAL-TIME PULSE</text>
  <g class="live-pill">
    <circle cx="720" cy="13" r="4" fill="#42be65" />
    <text x="730" y="16.5" fill="#42be65" font-size="10" font-weight="700" class="font-mono">PULSE: OK</text>
  </g>

  <!-- Oscillograph Waveform Path -->
  <g transform="translate(24, 45)">
    <!-- Base grid line -->
    <line x1="0" y1="25" x2="450" y2="25" stroke="#162238" stroke-width="1" />
    <line x1="0" y1="0" x2="450" y2="0" stroke="#162238" stroke-width="0.5" stroke-dasharray="2 4" />
    <line x1="0" y1="50" x2="450" y2="50" stroke="#162238" stroke-width="0.5" stroke-dasharray="2 4" />

    <!-- Animated Waveform -->
    <path d="M 0 25 Q 30 25, 45 5 T 75 45 T 105 25 T 150 25 T 170 -5 T 195 55 T 225 25 T 280 25 T 300 0 T 320 50 T 345 25 T 450 25"
          fill="none" stroke="url(#wave-grad)" stroke-width="2" class="wave-path" />
  </g>

  <!-- Telemetry Metrics Grid on Right -->
  <g transform="translate(505, 38)">
    <rect width="270" height="76" rx="6" fill="#0d1527" stroke="#1c283f" stroke-width="1" />
    
    <text x="14" y="22" fill="#64748b" font-size="10" class="font-mono">QUALITY GATE:</text>
    <text x="140" y="22" fill="#42be65" font-size="10" font-weight="700" class="font-mono">100% PASSING (CI)</text>

    <text x="14" y="44" fill="#64748b" font-size="10" class="font-mono">TEST SUITE:</text>
    <text x="140" y="44" fill="#00d2d3" font-size="10" font-weight="700" class="font-mono">VITEST STRICT</text>

    <text x="14" y="66" fill="#64748b" font-size="10" class="font-mono">DEPLOYMENT:</text>
    <text x="140" y="66" fill="#4589ff" font-size="10" font-weight="700" class="font-mono">GITHUB PAGES LIVE</text>
  </g>
</svg>
