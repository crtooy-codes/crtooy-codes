<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <style>
      .font-mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, Courier, monospace; }
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

      @keyframes radarSweepMain {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      @keyframes blipPulse {
        0%, 100% { opacity: 0.3; transform: scale(0.9); }
        50% { opacity: 1; filter: drop-shadow(0 0 6px #00d2d3); transform: scale(1.15); }
      }

      @keyframes textFlicker {
        0%, 100% { opacity: 0.95; }
        50% { opacity: 0.7; }
      }

      .radar-beam {
        transform-origin: 160px 120px;
        animation: radarSweepMain 5s linear infinite;
      }

      .blip-1 { animation: blipPulse 2.5s ease-in-out infinite; transform-origin: 215px 75px; }
      .blip-2 { animation: blipPulse 2.8s ease-in-out infinite 0.7s; transform-origin: 220px 165px; }
      .blip-3 { animation: blipPulse 3.1s ease-in-out infinite 1.4s; transform-origin: 105px 165px; }
      .blip-4 { animation: blipPulse 2.2s ease-in-out infinite 2.1s; transform-origin: 105px 75px; }

      .flicker { animation: textFlicker 3s ease-in-out infinite; }

      @media (prefers-reduced-motion: reduce) {
        .radar-beam, .blip-1, .blip-2, .blip-3, .blip-4, .flicker { animation: none; }
      }
    </style>

    <radialGradient id="radar-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00d2d3" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#080c14" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="beam-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2d3" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#0f62fe" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#080c14" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="card-border-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f62fe" />
      <stop offset="50%" stop-color="#00d2d3" />
      <stop offset="100%" stop-color="#42be65" />
    </linearGradient>
  </defs>

  <!-- Container Box -->
  <rect width="800" height="240" rx="12" fill="#080c14" stroke="#1c283f" stroke-width="1.5" />

  <!-- Top Title Header Bar -->
  <rect width="800" height="32" rx="12" fill="#0d1527" />
  <rect x="0" y="22" width="800" height="10" fill="#0d1527" />
  <line x1="0" y1="32" x2="800" y2="32" stroke="#1c283f" stroke-width="1" />

  <g transform="translate(24, 21)">
    <circle cx="6" cy="0" r="4" fill="#00d2d3" />
    <text x="18" y="4" fill="#00d2d3" font-size="11" font-weight="700" class="font-mono" letter-spacing="1">📡 TACTICAL RADAR &amp; ACTIVE BUILD RECON</text>
  </g>
  <text x="776" y="21" text-anchor="end" fill="#42be65" font-size="10" font-weight="700" class="font-mono">STATUS: 4 TARGETS ACQUIRED</text>

  <!-- LEFT: POLAR RADAR SCOPE (Center at X: 160, Y: 136) -->
  <g transform="translate(0, 0)">
    <!-- Radar Ambient Background -->
    <circle cx="160" cy="136" r="85" fill="url(#radar-glow)" />
    
    <!-- Concentric Distance Rings -->
    <circle cx="160" cy="136" r="85" fill="none" stroke="#1c283f" stroke-width="1.2" />
    <circle cx="160" cy="136" r="60" fill="none" stroke="#1c283f" stroke-width="0.8" stroke-dasharray="3 3" />
    <circle cx="160" cy="136" r="35" fill="none" stroke="#1c283f" stroke-width="0.8" />
    <circle cx="160" cy="136" r="10" fill="none" stroke="#1c283f" stroke-width="0.8" />

    <!-- Crosshairs & Azimuth Axes -->
    <line x1="65" y1="136" x2="255" y2="136" stroke="#1c283f" stroke-width="1" />
    <line x1="160" y1="41" x2="160" y2="231" stroke="#1c283f" stroke-width="1" />
    
    <!-- Diagonal Grids -->
    <line x1="100" y1="76" x2="220" y2="196" stroke="#162238" stroke-width="0.6" stroke-dasharray="2 2" />
    <line x1="100" y1="196" x2="220" y2="76" stroke="#162238" stroke-width="0.6" stroke-dasharray="2 2" />

    <!-- Azimuth Degree Marks -->
    <text x="160" y="52" text-anchor="middle" fill="#64748b" font-size="7.5" class="font-mono">000°</text>
    <text x="245" y="139" fill="#64748b" font-size="7.5" class="font-mono">090°</text>
    <text x="160" y="226" text-anchor="middle" fill="#64748b" font-size="7.5" class="font-mono">180°</text>
    <text x="70" y="139" fill="#64748b" font-size="7.5" class="font-mono">270°</text>

    <!-- Rotating Radar Sweep Beam -->
    <g class="radar-beam">
      <path d="M 160 136 L 245 136 A 85 85 0 0 0 220 76 Z" fill="url(#beam-grad)" />
      <line x1="160" y1="136" x2="245" y2="136" stroke="#00d2d3" stroke-width="1.8" />
    </g>

    <!-- Target Blips on Scope -->
    <!-- Blip 1: CRTOOY OS (NE Quadrant) -->
    <g class="blip-1">
      <circle cx="215" cy="85" r="4.5" fill="#00d2d3" />
      <circle cx="215" cy="85" r="8" fill="none" stroke="#00d2d3" stroke-width="1" opacity="0.6" />
      <text x="226" y="83" fill="#00d2d3" font-size="8" font-weight="700" class="font-mono">T1:CRTOOY</text>
    </g>

    <!-- Blip 2: OPENLPS (SE Quadrant) -->
    <g class="blip-2">
      <circle cx="210" cy="180" r="4" fill="#4589ff" />
      <circle cx="210" cy="180" r="7" fill="none" stroke="#4589ff" stroke-width="1" opacity="0.6" />
      <text x="221" y="184" fill="#4589ff" font-size="8" font-weight="700" class="font-mono">T2:OPENLPS</text>
    </g>

    <!-- Blip 3: BODYCAM-FPS (SW Quadrant) -->
    <g class="blip-3">
      <circle cx="105" cy="180" r="4" fill="#42be65" />
      <circle cx="105" cy="180" r="7" fill="none" stroke="#42be65" stroke-width="1" opacity="0.6" />
      <text x="50" y="184" fill="#42be65" font-size="8" font-weight="700" class="font-mono">T3:BODYCAM</text>
    </g>

    <!-- Blip 4: APPLIED AI (NW Quadrant) -->
    <g class="blip-4">
      <circle cx="105" cy="85" r="4" fill="#a855f7" />
      <circle cx="105" cy="85" r="7" fill="none" stroke="#a855f7" stroke-width="1" opacity="0.6" />
      <text x="55" y="83" fill="#a855f7" font-size="8" font-weight="700" class="font-mono">T4:AI-AGENTS</text>
    </g>
  </g>

  <!-- VERTICAL DIVIDER -->
  <line x1="305" y1="32" x2="305" y2="240" stroke="#1c283f" stroke-width="1" />

  <!-- RIGHT: TARGET ACQUISITION MATRIX & DETAILS -->
  <g transform="translate(325, 46)">
    <!-- TARGET 01 -->
    <g transform="translate(0, 0)">
      <rect width="450" height="40" rx="6" fill="#0d1527" stroke="#1c283f" stroke-width="1" />
      <rect x="0" y="0" width="4" height="40" rx="2" fill="#00d2d3" />
      <text x="14" y="16" fill="#f8fafc" font-size="11" font-weight="700" class="font-mono">⚡ T1 // CRTOOY DEVELOPER OPERATING SYSTEM</text>
      <text x="375" y="16" fill="#00d2d3" font-size="9" font-weight="700" class="font-mono">[ ACTIVE FLAGSHIP ]</text>
      <text x="14" y="31" fill="#94a3b8" font-size="9.5" class="font-mono">Stack: TypeScript Strict • React 18 • Web Audio API • PWA • CLI</text>
    </g>

    <!-- TARGET 02 -->
    <g transform="translate(0, 46)">
      <rect width="450" height="40" rx="6" fill="#0d1527" stroke="#1c283f" stroke-width="1" />
      <rect x="0" y="0" width="4" height="40" rx="2" fill="#4589ff" />
      <text x="14" y="16" fill="#f8fafc" font-size="11" font-weight="700" class="font-mono">🛡️ T2 // OPENLPS NETWORK SECURITY TOOLKIT</text>
      <text x="382" y="16" fill="#4589ff" font-size="9" font-weight="700" class="font-mono">[ RESEARCH LAB ]</text>
      <text x="14" y="31" fill="#94a3b8" font-size="9.5" class="font-mono">Stack: Kotlin • Android Root Chroot • Nmap • Protocol Auditing</text>
    </g>

    <!-- TARGET 03 -->
    <g transform="translate(0, 92)">
      <rect width="450" height="40" rx="6" fill="#0d1527" stroke="#1c283f" stroke-width="1" />
      <rect x="0" y="0" width="4" height="40" rx="2" fill="#42be65" />
      <text x="14" y="16" fill="#f8fafc" font-size="11" font-weight="700" class="font-mono">🎮 T3 // BODYCAM FPS 3D TACTICAL SIMULATION</text>
      <text x="388" y="16" fill="#42be65" font-size="9" font-weight="700" class="font-mono">[ 3D PROTOTYPE ]</text>
      <text x="14" y="31" fill="#94a3b8" font-size="9.5" class="font-mono">Stack: Three.js • WebGL Shaders • React 18 • Procedural Audio</text>
    </g>

    <!-- TARGET 04 -->
    <g transform="translate(0, 138)">
      <rect width="450" height="40" rx="6" fill="#0d1527" stroke="#1c283f" stroke-width="1" />
      <rect x="0" y="0" width="4" height="40" rx="2" fill="#a855f7" />
      <text x="14" y="16" fill="#f8fafc" font-size="11" font-weight="700" class="font-mono">🤖 T4 // APPLIED AI &amp; AUTONOMOUS AGENT RUNTIMES</text>
      <text x="390" y="16" fill="#a855f7" font-size="9" font-weight="700" class="font-mono">[ ACTIVE FOCUS ]</text>
      <text x="14" y="31" fill="#94a3b8" font-size="9.5" class="font-mono">Stack: Local LLMs • Agentic Workflows • Tool Use • Automated CI/CD</text>
    </g>
  </g>
</svg>
