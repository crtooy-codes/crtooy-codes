<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="heroBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c14"/>
      <stop offset="50%" stop-color="#0d1322"/>
      <stop offset="100%" stop-color="#070a10"/>
    </linearGradient>

    <linearGradient id="ibmBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f62fe"/>
      <stop offset="100%" stop-color="#4589ff"/>
    </linearGradient>

    <linearGradient id="cyanLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d2d3"/>
      <stop offset="100%" stop-color="#0f62fe"/>
    </linearGradient>

    <radialGradient id="heroGlow" cx="80%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#0f62fe" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#080c14" stop-opacity="0"/>
    </radialGradient>

    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#162238" stroke-width="0.75" opacity="0.6"/>
      <circle cx="0" cy="0" r="1" fill="#203456" opacity="0.8"/>
    </pattern>

    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, Courier, monospace; }

      @keyframes pulseDot {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.3; }
      }

      @keyframes blinkCursor {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }

      @keyframes scanBeam {
        0% { transform: translateY(-50px); opacity: 0; }
        30% { opacity: 0.35; }
        70% { opacity: 0.35; }
        100% { transform: translateY(400px); opacity: 0; }
      }

      .dot-pulse { animation: pulseDot 2s infinite ease-in-out; }
      .cursor-blink { animation: blinkCursor 0.9s infinite; }
      .scan { animation: scanBeam 4s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
    </style>
  </defs>

  <!-- Card Base -->
  <rect width="850" height="380" rx="14" fill="url(#heroBg)"/>
  <rect width="850" height="380" rx="14" fill="url(#heroGlow)"/>
  <rect width="850" height="380" rx="14" fill="url(#grid)"/>
  <rect width="848" height="378" x="1" y="1" rx="13" fill="none" stroke="#1d283f" stroke-width="1.2"/>

  <!-- Scanning Beam -->
  <g clip-path="url(#heroClip)">
    <clipPath id="heroClip">
      <rect width="850" height="380" rx="14"/>
    </clipPath>
    <line x1="0" y1="0" x2="850" y2="0" stroke="url(#ibmBlue)" stroke-width="2" class="scan" opacity="0.35"/>
  </g>

  <!-- Status Badge (Top Left) -->
  <g transform="translate(36, 32)">
    <rect width="195" height="26" rx="13" fill="#10192d" stroke="#223556" stroke-width="1"/>
    <circle cx="14" cy="13" r="4.5" fill="#42be65" class="dot-pulse"/>
    <text x="26" y="17" fill="#8ba2c4" font-size="11" font-weight="600" class="mono" letter-spacing="1">SYSTEM ONLINE</text>
    <text x="142" y="17" fill="#4589ff" font-size="10" font-weight="700" class="mono">// 2026</text>
  </g>

  <!-- Official IBM 8-Bar Logo Vector (Top Right) -->
  <g id="ibm-logo" transform="translate(605, 30) scale(0.68)" fill="url(#ibmBlue)">
    <!-- Bar 0 -->
    <rect x="0" y="0" width="52" height="8" rx="1"/>
    <rect x="70" y="0" width="70" height="8" rx="1"/>
    <rect x="168" y="0" width="16" height="8"/>
    <rect x="210" y="0" width="16" height="8" rx="1"/>
    <rect x="252" y="0" width="16" height="8"/>

    <!-- Bar 1 -->
    <rect x="18" y="16" width="16" height="8" rx="1"/>
    <rect x="70" y="16" width="16" height="8"/>
    <rect x="124" y="16" width="18" height="8" rx="1"/>
    <rect x="168" y="16" width="16" height="8"/>
    <rect x="200" y="16" width="14" height="8"/>
    <rect x="222" y="16" width="14" height="8"/>
    <rect x="252" y="16" width="16" height="8"/>

    <!-- Bar 2 -->
    <rect x="18" y="32" width="16" height="8" rx="1"/>
    <rect x="70" y="32" width="16" height="8"/>
    <rect x="126" y="32" width="18" height="8" rx="1"/>
    <rect x="168" y="32" width="16" height="8"/>
    <rect x="194" y="32" width="14" height="8"/>
    <rect x="228" y="32" width="14" height="8"/>
    <rect x="252" y="32" width="16" height="8"/>

    <!-- Bar 3 -->
    <rect x="18" y="48" width="16" height="8" rx="1"/>
    <rect x="70" y="48" width="68" height="8" rx="1"/>
    <rect x="168" y="48" width="16" height="8"/>
    <rect x="211" y="48" width="14" height="8" rx="1"/>
    <rect x="252" y="48" width="16" height="8"/>

    <!-- Bar 4 -->
    <rect x="18" y="64" width="16" height="8" rx="1"/>
    <rect x="70" y="64" width="16" height="8"/>
    <rect x="128" y="64" width="20" height="8" rx="1"/>
    <rect x="168" y="64" width="16" height="8"/>
    <rect x="252" y="64" width="16" height="8"/>

    <!-- Bar 5 -->
    <rect x="18" y="80" width="16" height="8" rx="1"/>
    <rect x="70" y="80" width="16" height="8"/>
    <rect x="130" y="80" width="20" height="8" rx="1"/>
    <rect x="168" y="80" width="16" height="8"/>
    <rect x="252" y="80" width="16" height="8"/>

    <!-- Bar 6 -->
    <rect x="18" y="96" width="16" height="8" rx="1"/>
    <rect x="70" y="96" width="16" height="8"/>
    <rect x="126" y="96" width="20" height="8" rx="1"/>
    <rect x="168" y="96" width="16" height="8"/>
    <rect x="252" y="96" width="16" height="8"/>

    <!-- Bar 7 -->
    <rect x="0" y="112" width="52" height="8" rx="1"/>
    <rect x="70" y="112" width="74" height="8" rx="1"/>
    <rect x="168" y="112" width="16" height="8"/>
    <rect x="252" y="112" width="16" height="8"/>
  </g>

  <!-- Name & Professional Title -->
  <text x="36" y="110" fill="#ffffff" font-size="32" font-weight="800" class="sans" letter-spacing="2">GABRIEL SILVA</text>
  
  <g transform="translate(36, 124)">
    <rect width="188" height="24" rx="4" fill="#0f62fe" fill-opacity="0.15" stroke="#0f62fe" stroke-width="0.8"/>
    <text x="10" y="16" fill="#78a9ff" font-size="12" font-weight="600" class="mono" letter-spacing="1">Apprentice @ IBM Brasil</text>
  </g>

  <!-- Terminal Container & Strict Distinct Y Lines -->
  <rect x="36" y="165" width="778" height="135" rx="8" fill="#0a0e18" fill-opacity="0.9" stroke="#1a273f" stroke-width="1"/>

  <!-- Line 1 (y=195) -->
  <text x="56" y="195" fill="#52688f" font-size="12.5" class="mono">&gt;</text>
  <text x="74" y="195" fill="#94a3b8" font-size="12.5" class="mono">system initialized</text>
  <text x="215" y="195" fill="#3b4d6e" font-size="12.5" class="mono">.......................................</text>
  <text x="515" y="195" fill="#42be65" font-size="12.5" font-weight="600" class="mono">[ ONLINE ]</text>

  <!-- Line 2 (y=222) -->
  <text x="56" y="222" fill="#52688f" font-size="12.5" class="mono">&gt;</text>
  <text x="74" y="222" fill="#cbd5e1" font-size="12.5" class="mono">focus:</text>
  <text x="130" y="222" fill="#94a3b8" font-size="12.5" class="mono">technology + automation + applied AI</text>

  <!-- Line 3 (y=249) -->
  <text x="56" y="249" fill="#52688f" font-size="12.5" class="mono">&gt;</text>
  <text x="74" y="249" fill="#cbd5e1" font-size="12.5" class="mono">trajectory:</text>
  <text x="175" y="249" fill="#4589ff" font-size="12.5" font-weight="600" class="mono">Apprentice @ IBM Brasil</text>

  <!-- Line 4 (y=276) -->
  <text x="56" y="276" fill="#52688f" font-size="12.5" class="mono">&gt;</text>
  <text x="74" y="276" fill="#cbd5e1" font-size="12.5" class="mono">current phase:</text>
  <text x="195" y="276" fill="#00d2d3" font-size="12.5" font-weight="600" class="mono">BUILDING &amp; LEARNING</text>
  <text x="365" y="276" fill="#4589ff" font-size="13" font-weight="700" class="mono cursor-blink">▌</text>

  <!-- Action Manifesto Footer (y=342) -->
  <text x="36" y="342" fill="#ffffff" font-size="12" font-weight="700" class="mono" letter-spacing="3">BUILD.</text>
  <text x="105" y="342" fill="#4589ff" font-size="12" font-weight="700" class="mono" letter-spacing="3">LEARN.</text>
  <text x="180" y="342" fill="#00d2d3" font-size="12" font-weight="700" class="mono" letter-spacing="3">CREATE.</text>
  <line x1="36" y1="352" x2="260" y2="352" stroke="url(#cyanLine)" stroke-width="1.5" opacity="0.8"/>

  <!-- Footer ID Tag -->
  <text x="735" y="342" fill="#4a5f82" font-size="10" font-weight="600" class="mono" letter-spacing="1">GSO // v2.0</text>
</svg>
