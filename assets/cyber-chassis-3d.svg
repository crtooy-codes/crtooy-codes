<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" width="100%" height="100%">
  <defs>
    <style>
      .font-mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, Courier, monospace; }
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

      /* 3D Gyroscope and Orbital Ring Rotations */
      @keyframes orbitRing1 {
        0% { transform: rotate(0deg) scaleY(0.35); }
        50% { transform: rotate(180deg) scaleY(0.85); }
        100% { transform: rotate(360deg) scaleY(0.35); }
      }
      @keyframes orbitRing2 {
        0% { transform: rotate(45deg) scaleX(0.4); }
        50% { transform: rotate(225deg) scaleX(0.9); }
        100% { transform: rotate(405deg) scaleX(0.4); }
      }
      @keyframes orbitRing3 {
        0% { transform: rotate(90deg) scale(0.65); }
        50% { transform: rotate(270deg) scale(0.95); }
        100% { transform: rotate(450deg) scale(0.65); }
      }

      /* Quantum Singularity Pulse */
      @keyframes coreSingularity {
        0%, 100% { r: 10; opacity: 0.8; filter: drop-shadow(0 0 4px #00d2d3); }
        50% { r: 15; opacity: 1; filter: drop-shadow(0 0 16px #0f62fe); }
      }

      /* Register Bus Flow */
      @keyframes registerShift {
        0% { opacity: 0.4; }
        50% { opacity: 1; }
        100% { opacity: 0.4; }
      }

      /* Thermal Wave */
      @keyframes thermalWaveMove {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -120; }
      }

      .ring-1 { transform-origin: 150px 135px; animation: orbitRing1 7s linear infinite; }
      .ring-2 { transform-origin: 150px 135px; animation: orbitRing2 9s linear infinite; }
      .ring-3 { transform-origin: 150px 135px; animation: orbitRing3 12s linear infinite; }
      .singularity { animation: coreSingularity 2.5s ease-in-out infinite; }
      .reg-flicker { animation: registerShift 2s ease-in-out infinite; }
      .thermal-wave { stroke-dasharray: 8 4; animation: thermalWaveMove 3s linear infinite; }

      @media (prefers-reduced-motion: reduce) {
        .ring-1, .ring-2, .ring-3, .singularity, .reg-flicker, .thermal-wave { animation: none; }
      }
    </style>

    <radialGradient id="singularity-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#00d2d3" />
      <stop offset="70%" stop-color="#0f62fe" />
      <stop offset="100%" stop-color="#080c14" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="blade-border" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f62fe" />
      <stop offset="50%" stop-color="#00d2d3" />
      <stop offset="100%" stop-color="#42be65" />
    </linearGradient>

    <linearGradient id="thermal-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d2d3" />
      <stop offset="60%" stop-color="#0f62fe" />
      <stop offset="100%" stop-color="#ff7eb6" />
    </linearGradient>
  </defs>

  <!-- Main Chassis Surface -->
  <rect width="800" height="260" rx="12" fill="#070b12" stroke="#1c283f" stroke-width="1.5" />

  <!-- Top Title Strip -->
  <rect width="800" height="32" rx="12" fill="#0d1527" />
  <rect x="0" y="22" width="800" height="10" fill="#0d1527" />
  <line x1="0" y1="32" x2="800" y2="32" stroke="#1c283f" stroke-width="1" />

  <g transform="translate(24, 21)">
    <circle cx="6" cy="0" r="4" fill="#00d2d3" />
    <text x="18" y="4" fill="#00d2d3" font-size="11" font-weight="700" class="font-mono" letter-spacing="1">⚛️ 3D QUANTUM CHASSIS and ISOMETRIC TENSOR CORE</text>
  </g>
  <text x="776" y="21" text-anchor="end" fill="#42be65" font-size="10" font-weight="700" class="font-mono">CLOCK: 4.80 GHz // 0.42ns PIPELINE</text>

  <!-- LEFT: 3D HOLOGRAPHIC GYROSCOPE and QUANTUM CORE (Center: 150, 140) -->
  <g>
    <!-- Outer Hologram Boundary Hexagon -->
    <polygon points="150,55 220,95 220,175 150,215 80,175 80,95" fill="none" stroke="#1c283f" stroke-width="1" stroke-dasharray="3 3" opacity="0.6" />

    <!-- 3D Gyroscope Orbital Rings -->
    <ellipse cx="150" cy="135" rx="65" ry="65" fill="none" stroke="#0f62fe" stroke-width="1.5" stroke-dasharray="6 3" class="ring-1" opacity="0.7" />
    <ellipse cx="150" cy="135" rx="55" ry="55" fill="none" stroke="#00d2d3" stroke-width="1.4" stroke-dasharray="8 4" class="ring-2" opacity="0.8" />
    <ellipse cx="150" cy="135" rx="45" ry="45" fill="none" stroke="#a855f7" stroke-width="1.2" stroke-dasharray="4 2" class="ring-3" opacity="0.7" />

    <!-- Isometric Vector Axes -->
    <line x1="150" y1="70" x2="150" y2="200" stroke="#1c283f" stroke-width="0.8" />
    <line x1="90" y1="100" x2="210" y2="170" stroke="#1c283f" stroke-width="0.8" />
    <line x1="90" y1="170" x2="210" y2="100" stroke="#1c283f" stroke-width="0.8" />

    <!-- Central Singularity Emitter -->
    <circle cx="150" cy="135" r="18" fill="url(#singularity-glow)" />
    <circle cx="150" cy="135" r="10" fill="#ffffff" class="singularity" />

    <!-- Axis Labels -->
    <text x="150" y="65" text-anchor="middle" fill="#64748b" font-size="8" class="font-mono">Z+ [TENSOR]</text>
    <text x="150" y="222" text-anchor="middle" fill="#64748b" font-size="8" class="font-mono">Z- [NEURAL]</text>
    <text x="75" y="140" text-anchor="end" fill="#64748b" font-size="8" class="font-mono">X-</text>
    <text x="225" y="140" fill="#64748b" font-size="8" class="font-mono">X+</text>
  </g>

  <!-- VERTICAL SEPARATOR -->
  <line x1="290" y1="32" x2="290" y2="260" stroke="#1c283f" stroke-width="1" />

  <!-- RIGHT: ISOMETRIC REGISTER and PIPELINE TELEMETRY -->
  <g transform="translate(310, 46)">
    <!-- BLOCK 1: REGISTER MAP (HEX DUMP) -->
    <g transform="translate(0, 0)">
      <rect width="465" height="58" rx="6" fill="#0d1527" stroke="#1c283f" stroke-width="1" />
      <rect x="0" y="0" width="4" height="58" rx="2" fill="#00d2d3" />
      <text x="14" y="16" fill="#00d2d3" font-size="10" font-weight="700" class="font-mono">REGISTER MAP // REAL-TIME EXECUTION HEAP</text>
      
      <!-- Hexadecimal Stream -->
      <text x="14" y="34" fill="#cbd5e1" font-size="9.5" class="font-mono class reg-flicker">
        <tspan fill="#64748b">0x7FFE00: </tspan>43 52 54 4F 4F 59 5F 4F 53  <tspan fill="#42be65">[CRTOOY_OS]</tspan>
      </text>
      <text x="14" y="48" fill="#cbd5e1" font-size="9.5" class="font-mono">
        <tspan fill="#64748b">0x7FFE10: </tspan>49 42 4D 5F 41 50 50 52 45  <tspan fill="#0f62fe">[IBM_APPRENTICE]</tspan>
      </text>
      <text x="320" y="34" fill="#a855f7" font-size="9" class="font-mono">HEAP: 0KB LEAK</text>
      <text x="320" y="48" fill="#42be65" font-size="9" class="font-mono">GC: ZERO PAUSE</text>
    </g>

    <!-- BLOCK 2: THERMAL DISSIPATION and FLUX -->
    <g transform="translate(0, 66)">
      <rect width="465" height="64" rx="6" fill="#0d1527" stroke="#1c283f" stroke-width="1" />
      <rect x="0" y="0" width="4" height="64" rx="2" fill="#0f62fe" />
      
      <text x="14" y="16" fill="#f8fafc" font-size="10" font-weight="700" class="font-mono">THERMAL DISSIPATION and ENERGY EFFICIENCY</text>
      <text x="365" y="16" fill="#42be65" font-size="9.5" font-weight="700" class="font-mono">34.2and#176;C [NOMINAL]</text>

      <!-- Thermal Wave Curve -->
      <path d="M 14 42 Q 50 25, 80 42 T 150 42 T 220 42 T 290 42 T 360 42 T 430 42" fill="none" stroke="url(#thermal-grad)" stroke-width="2" class="thermal-wave" />
      <line x1="14" y1="42" x2="445" y2="42" stroke="#162238" stroke-width="0.8" stroke-dasharray="2 2" />

      <text x="14" y="58" fill="#64748b" font-size="8.5" class="font-mono">FAN: SILENT MODE (0 RPM) and#8226; TDP: 15W and#8226; QUANTUM EFFICIENCY: 99.8%</text>
    </g>

    <!-- BLOCK 3: HARDWARE ACCELERATION BADGES -->
    <g transform="translate(0, 138)">
      <!-- Badge 1 -->
      <g transform="translate(0, 0)">
        <rect width="145" height="30" rx="4" fill="#0d1527" stroke="#1c283f" stroke-width="1" />
        <circle cx="12" cy="15" r="3.5" fill="#00d2d3" />
        <text x="22" y="19" fill="#f8fafc" font-size="9" font-weight="600" class="font-mono">WEBGL 2.0 / SHADERS</text>
      </g>
      <!-- Badge 2 -->
      <g transform="translate(155, 0)">
        <rect width="150" height="30" rx="4" fill="#0d1527" stroke="#1c283f" stroke-width="1" />
        <circle cx="12" cy="15" r="3.5" fill="#4589ff" />
        <text x="22" y="19" fill="#f8fafc" font-size="9" font-weight="600" class="font-mono">WEB AUDIO DSP 96kHz</text>
      </g>
      <!-- Badge 3 -->
      <g transform="translate(315, 0)">
        <rect width="150" height="30" rx="4" fill="#0d1527" stroke="#1c283f" stroke-width="1" />
        <circle cx="12" cy="15" r="3.5" fill="#a855f7" />
        <text x="22" y="19" fill="#f8fafc" font-size="9" font-weight="600" class="font-mono">WASM SIMD COMPILED</text>
      </g>
    </g>
  </g>

  <!-- Bottom Edge Status -->
  <line x1="24" y1="236" x2="776" y2="236" stroke="#1c283f" stroke-width="1" />
  <text x="28" y="250" fill="#64748b" font-size="9" class="font-mono">HARDWARE RUNTIME: HYPERVISOR ACTIVE // NODE.JS 22 ESM STRICT</text>
  <text x="772" y="250" text-anchor="end" fill="#00d2d3" font-size="9" font-weight="700" class="font-mono">ZERO UNCAUGHT EXCEPTIONS</text>
</svg>
