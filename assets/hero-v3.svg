<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="100%" height="100%">
  <defs>
    <!-- Background Grid Pattern -->
    <pattern id="quantum-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#162238" stroke-width="0.8" stroke-opacity="0.5" />
    </pattern>

    <!-- Radial Corner Glows -->
    <radialGradient id="glow-core" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0f62fe" stop-opacity="0.22" />
      <stop offset="60%" stop-color="#00d2d3" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#080c14" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="corner-glow-left" cx="0%" cy="0%" r="45%">
      <stop offset="0%" stop-color="#0f62fe" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#080c14" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="corner-glow-right" cx="100%" cy="100%" r="50%">
      <stop offset="0%" stop-color="#00d2d3" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#080c14" stop-opacity="0" />
    </radialGradient>

    <!-- Linear Gradients for Badges & Accents -->
    <linearGradient id="neon-cyan-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f62fe" />
      <stop offset="50%" stop-color="#4589ff" />
      <stop offset="100%" stop-color="#00d2d3" />
    </linearGradient>

    <linearGradient id="text-shimmer" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#70d6ff" />
    </linearGradient>

    <linearGradient id="ibm-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f62fe" />
      <stop offset="100%" stop-color="#78a9ff" />
    </linearGradient>

    <style>
      .font-mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, Courier, monospace; }
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }

      /* Animation: Smooth Boot Reveal */
      @keyframes bootReveal {
        0% { opacity: 0; transform: translateY(8px); }
        100% { opacity: 1; transform: translateY(0); }
      }

      /* Animation: Ambient Radar Sweep */
      @keyframes radarRotate {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      /* Animation: Scanline Sweep */
      @keyframes scanSweep {
        0% { transform: translateY(-20px); opacity: 0; }
        15% { opacity: 0.5; }
        85% { opacity: 0.5; }
        100% { transform: translateY(340px); opacity: 0; }
      }

      /* Animation: Pulse Status Dot */
      @keyframes pulseGreen {
        0%, 100% { opacity: 1; filter: drop-shadow(0 0 2px #42be65); }
        50% { opacity: 0.4; filter: drop-shadow(0 0 8px #42be65); }
      }

      /* Animation: Hologram Audio/Spectrum Equalizer Bars */
      @keyframes eqBarA { 0%, 100% { height: 6px; y: 18px; } 50% { height: 20px; y: 4px; } }
      @keyframes eqBarB { 0%, 100% { height: 16px; y: 8px; } 50% { height: 8px; y: 16px; } }
      @keyframes eqBarC { 0%, 100% { height: 12px; y: 12px; } 50% { height: 22px; y: 2px; } }
      @keyframes eqBarD { 0%, 100% { height: 22px; y: 2px; } 50% { height: 10px; y: 14px; } }
      @keyframes eqBarE { 0%, 100% { height: 8px; y: 16px; } 50% { height: 18px; y: 6px; } }

      /* Staggered Reveal */
      .anim-boot { animation: bootReveal 0.85s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
      .delay-1 { animation-delay: 0.15s; opacity: 0; }
      .delay-2 { animation-delay: 0.35s; opacity: 0; }
      .delay-3 { animation-delay: 0.55s; opacity: 0; }
      .delay-4 { animation-delay: 0.75s; opacity: 0; }

      .radar-arm { transform-origin: 730px 65px; animation: radarRotate 8s linear infinite; }
      .scan-line { animation: scanSweep 6.5s linear infinite; }
      .pulse-dot { animation: pulseGreen 2.5s ease-in-out infinite; }

      .eq-1 { animation: eqBarA 1.4s ease-in-out infinite; }
      .eq-2 { animation: eqBarB 1.1s ease-in-out infinite; }
      .eq-3 { animation: eqBarC 1.6s ease-in-out infinite; }
      .eq-4 { animation: eqBarD 1.2s ease-in-out infinite; }
      .eq-5 { animation: eqBarE 1.5s ease-in-out infinite; }

      @media (prefers-reduced-motion: reduce) {
        .anim-boot, .delay-1, .delay-2, .delay-3, .delay-4 { animation: none; opacity: 1; }
        .radar-arm, .scan-line, .pulse-dot, .eq-1, .eq-2, .eq-3, .eq-4, .eq-5 { animation: none; }
      }
    </style>
  </defs>

  <!-- Container Surface -->
  <rect width="800" height="320" rx="14" fill="#080c14" stroke="#1c283f" stroke-width="1.5" />
  
  <!-- Subtle Gradient Overlays -->
  <rect width="800" height="320" rx="14" fill="url(#corner-glow-left)" />
  <rect width="800" height="320" rx="14" fill="url(#corner-glow-right)" />
  <rect width="800" height="320" rx="14" fill="url(#glow-core)" />
  <rect width="800" height="320" rx="14" fill="url(#quantum-grid)" />

  <!-- Tactical Corner Bracket Accents -->
  <path d="M 12 26 L 12 12 L 26 12" fill="none" stroke="#00d2d3" stroke-width="1.8" opacity="0.8" />
  <path d="M 788 26 L 788 12 L 774 12" fill="none" stroke="#00d2d3" stroke-width="1.8" opacity="0.8" />
  <path d="M 12 294 L 12 308 L 26 308" fill="none" stroke="#0f62fe" stroke-width="1.8" opacity="0.8" />
  <path d="M 788 294 L 788 308 L 774 308" fill="none" stroke="#0f62fe" stroke-width="1.8" opacity="0.8" />

  <!-- Ambient Radar Display (Top-Right) -->
  <g opacity="0.45">
    <circle cx="730" cy="65" r="28" fill="none" stroke="#1c283f" stroke-width="1" />
    <circle cx="730" cy="65" r="18" fill="none" stroke="#1c283f" stroke-width="0.8" stroke-dasharray="2 2" />
    <circle cx="730" cy="65" r="8" fill="none" stroke="#1c283f" stroke-width="0.8" />
    <line x1="700" y1="65" x2="760" y2="65" stroke="#1c283f" stroke-width="0.8" />
    <line x1="730" y1="35" x2="730" y2="95" stroke="#1c283f" stroke-width="0.8" />
    <line x1="730" y1="65" x2="756" y2="45" stroke="#00d2d3" stroke-width="1.5" class="radar-arm" />
    <circle cx="742" cy="55" r="2" fill="#00d2d3" />
  </g>

  <!-- Ambient Equalizer Spectrum (Top-Left) -->
  <g transform="translate(68, 65)" opacity="0.75">
    <rect x="0" y="8" width="3.5" height="16" rx="1.5" fill="#00d2d3" class="eq-1" />
    <rect x="7" y="4" width="3.5" height="20" rx="1.5" fill="#4589ff" class="eq-2" />
    <rect x="14" y="12" width="3.5" height="12" rx="1.5" fill="#0f62fe" class="eq-3" />
    <rect x="21" y="2" width="3.5" height="22" rx="1.5" fill="#42be65" class="eq-4" />
    <rect x="28" y="10" width="3.5" height="14" rx="1.5" fill="#00d2d3" class="eq-5" />
    <text x="38" y="20" fill="#64748b" font-size="9" font-weight="600" class="font-mono">AUDIO ENGINE // SYNTH</text>
  </g>

  <!-- Animated Laser Scanline -->
  <line x1="12" y1="0" x2="788" y2="0" stroke="url(#neon-cyan-blue)" stroke-width="1.2" opacity="0.4" class="scan-line" />

  <!-- TOP HEADER STRIP -->
  <g class="anim-boot delay-1">
    <!-- Status Indicator Pill -->
    <rect x="28" y="20" width="168" height="26" rx="13" fill="#0d1929" stroke="#1b365d" stroke-width="1" />
    <circle cx="42" cy="33" r="4" fill="#42be65" class="pulse-dot" />
    <text x="54" y="37" fill="#42be65" font-size="10" font-weight="700" class="font-mono" letter-spacing="0.8">SYSTEM ONLINE // v4.0</text>

    <!-- Center IBM Trajectory Badge -->
    <g transform="translate(296, 20)">
      <rect x="0" y="0" width="208" height="26" rx="6" fill="#0d1527" stroke="#1e293b" stroke-width="1" />
      
      <!-- Authentic Minimal 8-Bar IBM Vector -->
      <g transform="translate(10, 5.5) scale(0.7)">
        <g fill="url(#ibm-gradient)">
          <!-- I -->
          <rect x="0" y="0" width="12" height="1.8"/>
          <rect x="0" y="2.8" width="12" height="1.8"/>
          <rect x="3.5" y="5.6" width="5" height="1.8"/>
          <rect x="3.5" y="8.4" width="5" height="1.8"/>
          <rect x="3.5" y="11.2" width="5" height="1.8"/>
          <rect x="3.5" y="14" width="5" height="1.8"/>
          <rect x="0" y="16.8" width="12" height="1.8"/>
          <rect x="0" y="19.6" width="12" height="1.8"/>
          <!-- B -->
          <path d="M16,0 h10 v1.8 h-10 z M16,2.8 h12 v1.8 h-12 z M16,5.6 h4 v1.8 h-4 z M26,5.6 h2.5 v1.8 h-2.5 z M16,8.4 h11 v1.8 h-11 z M16,11.2 h11 v1.8 h-11 z M16,14 h4 v1.8 h-4 z M26,14 h2.5 v1.8 h-2.5 z M16,16.8 h12 v1.8 h-12 z M16,19.6 h10 v1.8 h-10 z"/>
          <!-- M -->
          <path d="M32,0 h4 v1.8 h-4 z M48,0 h4 v1.8 h-4 z M32,2.8 h6 v1.8 h-6 z M46,2.8 h6 v1.8 h-6 z M32,5.6 h3 v1.8 h-3 z M40,5.6 h4 v1.8 h-4 z M49,5.6 h3 v1.8 h-3 z M32,8.4 h3 v1.8 h-3 z M39,8.4 h6 v1.8 h-6 z M49,8.4 h3 v1.8 h-3 z M32,11.2 h3 v1.8 h-3 z M41,11.2 h2 v1.8 h-2 z M49,11.2 h3 v1.8 h-3 z M32,14 h3 v1.8 h-3 z M49,14 h3 v1.8 h-3 z M32,16.8 h3 v1.8 h-3 z M49,16.8 h3 v1.8 h-3 z M32,19.6 h3 v1.8 h-3 z M49,19.6 h3 v1.8 h-3 z"/>
        </g>
      </g>
      
      <text x="56" y="17" fill="#cbd5e1" font-size="10.5" font-weight="600" class="font-sans">Apprentice @ IBM Brasil</text>
    </g>

    <!-- Right Header Telemetry -->
    <text x="772" y="37" text-anchor="end" fill="#64748b" font-size="10.5" font-weight="600" class="font-mono" letter-spacing="1">CRTOOY // CONTROL NEXUS</text>
  </g>

  <!-- Horizontal Divider Strip -->
  <line x1="28" y1="56" x2="772" y2="56" stroke="#1c283f" stroke-width="1" />

  <!-- HERO CENTER IDENTITY -->
  <g class="anim-boot delay-2" text-anchor="middle">
    <!-- Main Headline with Gradient Glow -->
    <text x="400" y="118" fill="url(#text-shimmer)" font-size="34" font-weight="900" class="font-sans" letter-spacing="4.5">GABRIEL SILVA</text>
    
    <!-- Subtitle Roles with Cyber Cyan Accent -->
    <text x="400" y="150" fill="#00d2d3" font-size="13" font-weight="700" class="font-mono" letter-spacing="2.5">SOFTWARE BUILDER • SYSTEMS &amp; APPLIED AI</text>
    
    <!-- Tagline Motto -->
    <text x="400" y="180" fill="#94a3b8" font-size="12" font-weight="500" class="font-sans" letter-spacing="1.5">ENGINEERING DETERMINISTIC SYSTEMS &amp; NEXT-GEN RUNTIMES</text>
  </g>

  <!-- Horizontal Center Divider -->
  <line x1="80" y1="206" x2="720" y2="206" stroke="#162238" stroke-width="1" stroke-dasharray="4 4" />

  <!-- DOMAIN PILL BADGES (CENTERED) -->
  <g class="anim-boot delay-3">
    <!-- [ 💻 STRICT SYSTEMS ] -->
    <g transform="translate(68, 224)">
      <rect width="150" height="32" rx="6" fill="#0d1527" stroke="#1c283f" stroke-width="1" />
      <text x="75" y="20.5" text-anchor="middle" fill="#f8fafc" font-size="11" font-weight="600" class="font-mono">💻 STRICT SYSTEMS</text>
    </g>

    <!-- [ 🤖 APPLIED AI ] -->
    <g transform="translate(230, 224)">
      <rect width="160" height="32" rx="6" fill="#0d1527" stroke="#1c283f" stroke-width="1" />
      <text x="80" y="20.5" text-anchor="middle" fill="#f8fafc" font-size="11" font-weight="600" class="font-mono">🤖 APPLIED AI AGENTS</text>
    </g>

    <!-- [ 🛡️ SECOPS & LINUX ] -->
    <g transform="translate(402, 224)">
      <rect width="160" height="32" rx="6" fill="#0d1527" stroke="#1c283f" stroke-width="1" />
      <text x="80" y="20.5" text-anchor="middle" fill="#f8fafc" font-size="11" font-weight="600" class="font-mono">🛡️ SECOPS &amp; LINUX</text>
    </g>

    <!-- [ 🎮 3D & WEB AUDIO ] -->
    <g transform="translate(574, 224)">
      <rect width="158" height="32" rx="6" fill="#0d1527" stroke="#1c283f" stroke-width="1" />
      <text x="79" y="20.5" text-anchor="middle" fill="#f8fafc" font-size="11" font-weight="600" class="font-mono">🎮 3D &amp; WEB AUDIO</text>
    </g>
  </g>

  <!-- FOOTER STATUS BAR -->
  <g class="anim-boot delay-4">
    <line x1="28" y1="278" x2="772" y2="278" stroke="#1c283f" stroke-width="1" />
    <text x="32" y="299" fill="#64748b" font-size="10.5" font-weight="500" class="font-mono">CRTOOY CONTROL NEXUS // v4.0.0-PROD</text>
    <text x="768" y="299" text-anchor="end" fill="#00d2d3" font-size="10.5" font-weight="600" class="font-mono">OPEN SOURCE • DETERMINISTIC • LIVE</text>
  </g>
</svg>
