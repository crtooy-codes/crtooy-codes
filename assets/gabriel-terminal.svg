<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 290" width="100%" height="100%">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12"/>
      <stop offset="50%" stop-color="#0a0f1b"/>
      <stop offset="100%" stop-color="#060910"/>
    </linearGradient>

    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#121a2c"/>
      <stop offset="100%" stop-color="#0e1524"/>
    </linearGradient>

    <style>
      .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, Courier, monospace; }

      @keyframes termFadeIn {
        from { opacity: 0; transform: translateY(4px); }
        to { opacity: 1; transform: translateY(0); }
      }

      @keyframes termBlink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }

      .t-cmd-1 { opacity: 0; animation: termFadeIn 0.3s ease-out 0.3s forwards; }
      .t-out-1 { opacity: 0; animation: termFadeIn 0.3s ease-out 0.7s forwards; }

      .t-cmd-2 { opacity: 0; animation: termFadeIn 0.3s ease-out 1.2s forwards; }
      .t-out-2 { opacity: 0; animation: termFadeIn 0.3s ease-out 1.6s forwards; }

      .t-cmd-3 { opacity: 0; animation: termFadeIn 0.3s ease-out 2.1s forwards; }
      .t-out-3 { opacity: 0; animation: termFadeIn 0.3s ease-out 2.5s forwards; }

      .t-cmd-4 { opacity: 0; animation: termFadeIn 0.3s ease-out 3.0s forwards; }
      .t-out-4 { opacity: 0; animation: termFadeIn 0.3s ease-out 3.4s forwards; }

      .t-cursor {
        animation: termBlink 1s infinite 3.8s;
      }
    </style>
  </defs>

  <!-- Terminal Window Container -->
  <rect width="850" height="290" rx="12" fill="url(#termBg)"/>
  <rect width="848" height="288" x="1" y="1" rx="11" fill="none" stroke="#1c283e" stroke-width="1.2"/>

  <!-- Window Header Bar -->
  <path d="M 0 12 C 0 5.373 5.373 0 12 0 L 838 0 C 844.627 0 850 5.373 850 12 L 850 38 L 0 38 Z" fill="url(#headerGrad)"/>
  <line x1="0" y1="38" x2="850" y2="38" stroke="#1c283e" stroke-width="1"/>

  <!-- Window Action Buttons (macOS / Linux Style) -->
  <g transform="translate(18, 14)">
    <circle cx="0" cy="5" r="5.5" fill="#ff5f56"/>
    <circle cx="18" cy="5" r="5.5" fill="#ffbd2e"/>
    <circle cx="36" cy="5" r="5.5" fill="#27c93f"/>
  </g>

  <!-- Terminal Window Title -->
  <g transform="translate(425, 23)">
    <text text-anchor="middle" fill="#64748b" font-size="11.5" font-weight="500" class="mono">gabriel@ibm-workspace: ~ (zsh)</text>
  </g>

  <!-- Terminal Body Content -->
  <g class="mono" font-size="13" transform="translate(28, 68)">
    
    <!-- Item 1: whoami -->
    <g class="t-cmd-1">
      <text x="0" y="0" fill="#38bdf8" font-weight="700">gabriel@github</text>
      <text x="110" y="0" fill="#64748b">:</text>
      <text x="120" y="0" fill="#a5b4fc">~</text>
      <text x="130" y="0" fill="#64748b">$</text>
      <text x="145" y="0" fill="#f8fafc" font-weight="600">whoami</text>
    </g>
    <g class="t-out-1" transform="translate(0, 22)">
      <text x="0" y="0" fill="#e2e8f0" font-weight="500">Gabriel Silva</text>
    </g>

    <!-- Item 2: company -->
    <g class="t-cmd-2" transform="translate(0, 52)">
      <text x="0" y="0" fill="#38bdf8" font-weight="700">gabriel@github</text>
      <text x="110" y="0" fill="#64748b">:</text>
      <text x="120" y="0" fill="#a5b4fc">~</text>
      <text x="130" y="0" fill="#64748b">$</text>
      <text x="145" y="0" fill="#f8fafc" font-weight="600">company</text>
    </g>
    <g class="t-out-2" transform="translate(0, 74)">
      <text x="0" y="0" fill="#4589ff" font-weight="700">IBM Brasil</text>
    </g>

    <!-- Item 3: role -->
    <g class="t-cmd-3" transform="translate(0, 104)">
      <text x="0" y="0" fill="#38bdf8" font-weight="700">gabriel@github</text>
      <text x="110" y="0" fill="#64748b">:</text>
      <text x="120" y="0" fill="#a5b4fc">~</text>
      <text x="130" y="0" fill="#64748b">$</text>
      <text x="145" y="0" fill="#f8fafc" font-weight="600">role</text>
    </g>
    <g class="t-out-3" transform="translate(0, 126)">
      <text x="0" y="0" fill="#78a9ff" font-weight="500">Apprentice</text>
    </g>

    <!-- Item 4: status -->
    <g class="t-cmd-4" transform="translate(0, 156)">
      <text x="0" y="0" fill="#38bdf8" font-weight="700">gabriel@github</text>
      <text x="110" y="0" fill="#64748b">:</text>
      <text x="120" y="0" fill="#a5b4fc">~</text>
      <text x="130" y="0" fill="#64748b">$</text>
      <text x="145" y="0" fill="#f8fafc" font-weight="600">status</text>
    </g>
    <g class="t-out-4" transform="translate(0, 178)">
      <text x="0" y="0" fill="#42be65" font-weight="600">Building the next version of myself.</text>
      <text x="290" y="0" fill="#38bdf8" class="t-cursor" font-weight="700">_</text>
    </g>
  </g>
</svg>
