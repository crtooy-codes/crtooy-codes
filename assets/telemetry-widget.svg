<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 130" width="100%" height="100%">
  <defs>
    <style>
      .font-mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }

      @keyframes wavePulse {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -360; }
      }
      @keyframes blinkPill {
        0%, 100% { opacity: 1; filter: drop-shadow(0 0 2px #42be65); }
        50% { opacity: 0.35; }
      }

      .wave-path {
        stroke-dasharray: 14 6;
        animation: wavePulse 2.8s linear infinite;
      }
      .live-pill {
        animation: blinkPill 2s ease-in-out infinite;
      }

      @media (prefers-reduced-motion: reduce) {
        .wave-path, .live-pill { animation: none; }
      }
    </style>

    <linearGradient id="wave-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f62fe" />
      <stop offset="40%" stop-color="#00d2d3" />
      <stop offset="80%" stop-color="#42be65" />
      <stop offset="100%" stop-color="#70d6ff" />
    </linearGradient>
  </defs>

  <!-- Container Box -->
  <rect width="800" height="130" rx="10" fill="#080c14" stroke="#1c283f" stroke-width="1.5" />

  <!-- Header Strip -->
  <rect width="800" height="28" rx="10" fill="#0d1527" />
  <rect x="0" y="18" width="800" height="10" fill="#0d1527" />
  <line x1="0" y1="28" x2="800" y2="28" stroke="#1c283f" stroke-width="1" />

  <text x="24" y="18" fill="#64748b" font-size="10.5" font-weight="700" class="font-mono">ENGINE TELEMETRY &amp; CI/CD QUALITY GATES</text>
  <g class="live-pill">
    <circle cx="700" cy="14" r="4" fill="#42be65" />
    <text x="712" y="17.5" fill="#42be65" font-size="10" font-weight="700" class="font-mono">HEALTH: 100%</text>
  </g>

  <!-- Oscillograph Waveform Path -->
  <g transform="translate(24, 45)">
    <!-- Base grid line -->
    <line x1="0" y1="28" x2="450" y2="28" stroke="#162238" stroke-width="1" />
    <line x1="0" y1="5" x2="450" y2="5" stroke="#162238" stroke-width="0.5" stroke-dasharray="2 4" />
    <line x1="0" y1="52" x2="450" y2="52" stroke="#162238" stroke-width="0.5" stroke-dasharray="2 4" />

    <!-- Oscilloscope Grid Labels -->
    <text x="0" y="2" fill="#64748b" font-size="7.5" class="font-mono">+12.4dB</text>
    <text x="0" y="62" fill="#64748b" font-size="7.5" class="font-mono">-12.4dB</text>

    <!-- Animated Waveform -->
    <path d="M 0 28 Q 30 28, 45 6 T 75 50 T 105 28 T 150 28 T 170 -4 T 195 60 T 225 28 T 280 28 T 300 2 T 320 54 T 345 28 T 450 28"
          fill="none" stroke="url(#wave-grad)" stroke-width="2.2" class="wave-path" />
  </g>

  <!-- Telemetry Metrics Grid on Right -->
  <g transform="translate(505, 38)">
    <rect width="270" height="78" rx="6" fill="#0d1527" stroke="#1c283f" stroke-width="1" />
    
    <text x="14" y="22" fill="#94a3b8" font-size="10" class="font-mono">CI/CD BUILD:</text>
    <text x="135" y="22" fill="#42be65" font-size="10" font-weight="700" class="font-mono">PASSING (100%)</text>

    <text x="14" y="44" fill="#94a3b8" font-size="10" class="font-mono">TEST RUNNER:</text>
    <text x="135" y="44" fill="#00d2d3" font-size="10" font-weight="700" class="font-mono">VITEST STRICT</text>

    <text x="14" y="66" fill="#94a3b8" font-size="10" class="font-mono">DEPLOYMENT:</text>
    <text x="135" y="66" fill="#4589ff" font-size="10" font-weight="700" class="font-mono">GITHUB PAGES LIVE</text>
  </g>
</svg>
