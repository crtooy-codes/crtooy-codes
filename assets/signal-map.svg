<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 150" width="100%" height="100%">
  <defs>
    <style>
      .font-mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

      @keyframes pulseNodeGlow {
        0%, 100% { fill: #0f62fe; filter: drop-shadow(0 0 2px #0f62fe); }
        50% { fill: #00d2d3; filter: drop-shadow(0 0 6px #00d2d3); }
      }
      @keyframes busDashMove {
        to { stroke-dashoffset: -32; }
      }

      .pulsing-node { animation: pulseNodeGlow 3s ease-in-out infinite; }
      .data-bus { stroke-dasharray: 6 6; animation: busDashMove 2s linear infinite; }

      @media (prefers-reduced-motion: reduce) {
        .pulsing-node, .data-bus { animation: none; }
      }
    </style>

    <linearGradient id="bus-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f62fe" />
      <stop offset="50%" stop-color="#00d2d3" />
      <stop offset="100%" stop-color="#42be65" />
    </linearGradient>
  </defs>

  <!-- Container Box -->
  <rect width="800" height="150" rx="10" fill="#080c14" stroke="#1c283f" stroke-width="1.5" />

  <!-- Header Bar -->
  <rect width="800" height="28" rx="10" fill="#0d1527" />
  <rect x="0" y="18" width="800" height="10" fill="#0d1527" />
  <line x1="0" y1="28" x2="800" y2="28" stroke="#1c283f" stroke-width="1" />

  <text x="24" y="18" fill="#64748b" font-size="10.5" font-weight="700" class="font-mono" letter-spacing="1">SYSTEM ARCHITECTURE // NEURAL DATA-BUS</text>
  <text x="776" y="18" text-anchor="end" fill="#42be65" font-size="10" font-weight="700" class="font-mono">● 5 SUBNETS SYNCHRONIZED</text>

  <!-- Central Root Node: CRTOOY LABS -->
  <!-- Base Connecting Lines -->
  <path d="M 400 58 L 400 74 L 90 74 L 90 95" fill="none" stroke="#1c283f" stroke-width="1.8" />
  <path d="M 400 58 L 400 74 L 90 74 L 90 95" fill="none" stroke="url(#bus-grad)" stroke-width="1.4" class="data-bus" />

  <path d="M 400 58 L 400 74 L 245 74 L 245 95" fill="none" stroke="#1c283f" stroke-width="1.8" />
  <path d="M 400 58 L 400 74 L 245 74 L 245 95" fill="none" stroke="url(#bus-grad)" stroke-width="1.4" class="data-bus" />

  <path d="M 400 58 L 400 95" fill="none" stroke="#1c283f" stroke-width="1.8" />
  <path d="M 400 58 L 400 95" fill="none" stroke="url(#bus-grad)" stroke-width="1.4" class="data-bus" />

  <path d="M 400 58 L 400 74 L 555 74 L 555 95" fill="none" stroke="#1c283f" stroke-width="1.8" />
  <path d="M 400 58 L 400 74 L 555 74 L 555 95" fill="none" stroke="url(#bus-grad)" stroke-width="1.4" class="data-bus" />

  <path d="M 400 58 L 400 74 L 710 74 L 710 95" fill="none" stroke="#1c283f" stroke-width="1.8" />
  <path d="M 400 58 L 400 74 L 710 74 L 710 95" fill="none" stroke="url(#bus-grad)" stroke-width="1.4" class="data-bus" />

  <!-- Root Hub -->
  <g transform="translate(325, 38)">
    <rect width="150" height="28" rx="6" fill="#0f62fe" fill-opacity="0.2" stroke="#0f62fe" stroke-width="1.5" />
    <text x="75" y="18" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700" class="font-mono">⚡ CRTOOY KERNEL</text>
  </g>

  <!-- Subnet 1: Applied AI -->
  <g transform="translate(25, 96)">
    <rect width="130" height="34" rx="6" fill="#0d1527" stroke="#1c283f" stroke-width="1" />
    <circle cx="16" cy="17" r="4.5" fill="#0f62fe" class="pulsing-node" />
    <text x="72" y="21" text-anchor="middle" fill="#f8fafc" font-size="10.5" font-weight="600" class="font-mono">🤖 Applied AI</text>
  </g>

  <!-- Subnet 2: Automation -->
  <g transform="translate(180, 96)">
    <rect width="130" height="34" rx="6" fill="#0d1527" stroke="#1c283f" stroke-width="1" />
    <circle cx="16" cy="17" r="4.5" fill="#0f62fe" class="pulsing-node" style="animation-delay: 0.6s;" />
    <text x="72" y="21" text-anchor="middle" fill="#f8fafc" font-size="10.5" font-weight="600" class="font-mono">⚙️ Automation</text>
  </g>

  <!-- Subnet 3: Core Software -->
  <g transform="translate(335, 96)">
    <rect width="130" height="34" rx="6" fill="#0d1527" stroke="#1c283f" stroke-width="1" />
    <circle cx="16" cy="17" r="4.5" fill="#0f62fe" class="pulsing-node" style="animation-delay: 1.2s;" />
    <text x="72" y="21" text-anchor="middle" fill="#f8fafc" font-size="10.5" font-weight="600" class="font-mono">💻 Strict TS</text>
  </g>

  <!-- Subnet 4: SecOps & Linux -->
  <g transform="translate(490, 96)">
    <rect width="130" height="34" rx="6" fill="#0d1527" stroke="#1c283f" stroke-width="1" />
    <circle cx="16" cy="17" r="4.5" fill="#0f62fe" class="pulsing-node" style="animation-delay: 1.8s;" />
    <text x="72" y="21" text-anchor="middle" fill="#f8fafc" font-size="10.5" font-weight="600" class="font-mono">🛡️ SecOps</text>
  </g>

  <!-- Subnet 5: 3D & Audio -->
  <g transform="translate(645, 96)">
    <rect width="130" height="34" rx="6" fill="#0d1527" stroke="#1c283f" stroke-width="1" />
    <circle cx="16" cy="17" r="4.5" fill="#0f62fe" class="pulsing-node" style="animation-delay: 2.4s;" />
    <text x="72" y="21" text-anchor="middle" fill="#f8fafc" font-size="10.5" font-weight="600" class="font-mono">🎮 3D WebGL</text>
  </g>
</svg>
