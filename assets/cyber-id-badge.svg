<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="100%" height="100%">
  <defs>
    <style>
      .font-mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, Courier, monospace; }
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

      @keyframes badgeGlowPulse {
        0%, 100% { filter: drop-shadow(0 0 3px #00d2d3); }
        50% { filter: drop-shadow(0 0 10px #0f62fe); }
      }

      @keyframes holographicShine {
        0% { transform: translateX(-150px) skewX(-25deg); opacity: 0; }
        30% { opacity: 0.6; }
        60% { opacity: 0.6; }
        100% { transform: translateX(950px) skewX(-25deg); opacity: 0; }
      }

      @keyframes barcodeScan {
        0%, 100% { transform: translateY(0); opacity: 0.4; }
        50% { transform: translateY(45px); opacity: 1; filter: drop-shadow(0 0 4px #00d2d3); }
      }

      .badge-glow { animation: badgeGlowPulse 3s ease-in-out infinite; }
      .holo-shine { animation: holographicShine 6s cubic-bezier(0.4, 0, 0.2, 1) infinite; }
      .scanner-laser { animation: barcodeScan 2.5s ease-in-out infinite; }

      @media (prefers-reduced-motion: reduce) {
        .badge-glow, .holo-shine, .scanner-laser { animation: none; }
      }
    </style>

    <linearGradient id="passport-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f62fe" />
      <stop offset="50%" stop-color="#00d2d3" />
      <stop offset="100%" stop-color="#42be65" />
    </linearGradient>

    <linearGradient id="shine-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="50%" stop-color="#00d2d3" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <clipPath id="avatar-clip">
      <rect x="25" y="45" width="130" height="130" rx="12" />
    </clipPath>
  </defs>

  <!-- Container Box -->
  <rect width="800" height="220" rx="14" fill="#080c14" stroke="#1c283f" stroke-width="1.5" />

  <!-- Top Title Strip -->
  <rect width="800" height="32" rx="14" fill="#0d1527" />
  <rect x="0" y="22" width="800" height="10" fill="#0d1527" />
  <line x1="0" y1="32" x2="800" y2="32" stroke="#1c283f" stroke-width="1" />

  <g transform="translate(24, 21)">
    <circle cx="6" cy="0" r="4" fill="#00d2d3" />
    <text x="18" y="4" fill="#00d2d3" font-size="11" font-weight="700" class="font-mono" letter-spacing="1">🪪 CYBER-ID PASSPORT // VERIFIED DEVELOPER CREDENTIALS</text>
  </g>
  <text x="776" y="21" text-anchor="end" fill="#42be65" font-size="10" font-weight="700" class="font-mono">SECURITY CLEARANCE: LEVEL 5 (ROOT)</text>

  <!-- LEFT: AVATAR FRAME and PHOTO -->
  <g transform="translate(10, 5)">
    <!-- Outer Glowing Border Frame -->
    <rect x="23" y="43" width="134" height="134" rx="14" fill="none" stroke="url(#passport-border)" stroke-width="2" class="badge-glow" />
    
    <!-- Image Display -->
    <image href="avatar.jpg" x="25" y="45" width="130" height="130" preserveAspectRatio="xMidYMid slice" clip-path="url(#avatar-clip)" />

    <!-- Corner Tech Brackets on Avatar -->
    <path d="M 20 55 L 20 40 L 35 40" fill="none" stroke="#00d2d3" stroke-width="2" />
    <path d="M 160 55 L 160 40 L 145 40" fill="none" stroke="#00d2d3" stroke-width="2" />
    <path d="M 20 165 L 20 180 L 35 180" fill="none" stroke="#0f62fe" stroke-width="2" />
    <path d="M 160 165 L 160 180 L 145 180" fill="none" stroke="#0f62fe" stroke-width="2" />

    <!-- Live Verified Pill -->
    <rect x="42" y="165" width="96" height="18" rx="9" fill="#0d1929" stroke="#42be65" stroke-width="1" />
    <circle cx="54" cy="174" r="3" fill="#42be65" />
    <text x="63" y="177.5" fill="#42be65" font-size="8.5" font-weight="700" class="font-mono">VERIFIED ID</text>
  </g>

  <!-- CENTER: OPERATOR DATA and CREDENTIALS MATRIX -->
  <g transform="translate(190, 50)">
    <!-- Operator Name -->
    <text x="0" y="18" fill="#ffffff" font-size="18" font-weight="900" class="font-sans" letter-spacing="1">GABRIEL SILVA</text>
    <text x="180" y="18" fill="#00d2d3" font-size="11" font-weight="700" class="font-mono">[@crtooy-codes]</text>

    <!-- Role and Company Badges -->
    <g transform="translate(0, 30)">
      <rect width="180" height="24" rx="4" fill="#0d1527" stroke="#1c283f" stroke-width="1" />
      <text x="10" y="16" fill="#64748b" font-size="9" font-weight="700" class="font-mono">ROLE:</text>
      <text x="50" y="16" fill="#0f62fe" font-size="9.5" font-weight="700" class="font-sans">Apprentice @ IBM Brasil</text>
    </g>

    <g transform="translate(190, 30)">
      <rect width="180" height="24" rx="4" fill="#0d1527" stroke="#1c283f" stroke-width="1" />
      <text x="10" y="16" fill="#64748b" font-size="9" font-weight="700" class="font-mono">CORE:</text>
      <text x="50" y="16" fill="#00d2d3" font-size="9.5" font-weight="700" class="font-mono">Systems and Applied AI</text>
    </g>

    <!-- Attributes Data Grid -->
    <g transform="translate(0, 64)">
      <rect width="370" height="62" rx="6" fill="#0d1527" stroke="#1c283f" stroke-width="1" />
      
      <text x="14" y="18" fill="#64748b" font-size="9" class="font-mono">OPERATING SYSTEM:</text>
      <text x="145" y="18" fill="#f8fafc" font-size="9" font-weight="700" class="font-mono">CRTOOY KERNEL v4.5</text>

      <text x="14" y="34" fill="#64748b" font-size="9" class="font-mono">PRIMARY RUNTIMES:</text>
      <text x="145" y="34" fill="#42be65" font-size="9" font-weight="700" class="font-mono">TypeScript Strict &#8226; Node.js 22 &#8226; Kotlin</text>

      <text x="14" y="50" fill="#64748b" font-size="9" class="font-mono">FLAGSHIP PRODUCT:</text>
      <text x="145" y="50" fill="#4589ff" font-size="9" font-weight="700" class="font-mono">CRTOOY OS (Web + CLI npx crtooy)</text>
    </g>
  </g>

  <!-- RIGHT: HOLOGRAPHIC AUTH TOKEN and SCAN MATRIX -->
  <g transform="translate(590, 50)">
    <rect width="185" height="126" rx="8" fill="#0d1527" stroke="#1c283f" stroke-width="1" />
    
    <text x="14" y="18" fill="#64748b" font-size="8.5" font-weight="700" class="font-mono">AUTH TOKEN andamp; HASH</text>
    <text x="14" y="34" fill="#00d2d3" font-size="8" class="font-mono">SHA-256: 7f8a...9c2e</text>

    <!-- Barcode Matrix -->
    <g transform="translate(14, 44)">
      <rect width="157" height="50" fill="#05080e" stroke="#162238" stroke-width="0.8" />
      
      <!-- Barcode Bars -->
      <line x1="10" y1="5" x2="10" y2="45" stroke="#ffffff" stroke-width="2" />
      <line x1="16" y1="5" x2="16" y2="45" stroke="#ffffff" stroke-width="1" />
      <line x1="22" y1="5" x2="22" y2="45" stroke="#ffffff" stroke-width="3" />
      <line x1="30" y1="5" x2="30" y2="45" stroke="#ffffff" stroke-width="1.5" />
      <line x1="38" y1="5" x2="38" y2="45" stroke="#ffffff" stroke-width="4" />
      <line x1="48" y1="5" x2="48" y2="45" stroke="#ffffff" stroke-width="1" />
      <line x1="56" y1="5" x2="56" y2="45" stroke="#ffffff" stroke-width="2.5" />
      <line x1="66" y1="5" x2="66" y2="45" stroke="#ffffff" stroke-width="1.5" />
      <line x1="74" y1="5" x2="74" y2="45" stroke="#ffffff" stroke-width="3.5" />
      <line x1="84" y1="5" x2="84" y2="45" stroke="#ffffff" stroke-width="1" />
      <line x1="92" y1="5" x2="92" y2="45" stroke="#ffffff" stroke-width="2" />
      <line x1="102" y1="5" x2="102" y2="45" stroke="#ffffff" stroke-width="4" />
      <line x1="112" y1="5" x2="112" y2="45" stroke="#ffffff" stroke-width="1.5" />
      <line x1="120" y1="5" x2="120" y2="45" stroke="#ffffff" stroke-width="2" />
      <line x1="130" y1="5" x2="130" y2="45" stroke="#ffffff" stroke-width="3" />
      <line x1="140" y1="5" x2="140" y2="45" stroke="#ffffff" stroke-width="1" />
      <line x1="148" y1="5" x2="148" y2="45" stroke="#ffffff" stroke-width="2" />

      <!-- Scanning Laser Line -->
      <line x1="5" y1="0" x2="152" y2="0" stroke="#00d2d3" stroke-width="1.8" class="scanner-laser" />
    </g>

    <text x="92" y="112" text-anchor="middle" fill="#42be65" font-size="8" font-weight="700" class="font-mono">ACCESS: GRANTED</text>
  </g>

  <!-- Sweeping Holographic Sheen Layer -->
  <rect x="0" y="0" width="80" height="220" fill="url(#shine-grad)" class="holo-shine" pointer-events="none" />

  <!-- Bottom Line -->
  <line x1="24" y1="202" x2="776" y2="202" stroke="#1c283f" stroke-width="1" />
</svg>
