<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 160" width="100%" height="100%">
  <defs>
    <style>
      .font-mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, Courier, monospace; }
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

      /* Laser Welding Beam Pulse */
      @keyframes weldBeam {
        0%, 100% { opacity: 0.3; stroke-width: 1.5; }
        50% { opacity: 1; stroke-width: 3.5; filter: drop-shadow(0 0 8px #00d2d3); }
      }

      /* Welding Sparks Emission */
      @keyframes sparkBurst1 {
        0% { transform: translate(0, 0) scale(0.2); opacity: 0; }
        50% { opacity: 1; }
        100% { transform: translate(18px, -15px) scale(1.2); opacity: 0; }
      }
      @keyframes sparkBurst2 {
        0% { transform: translate(0, 0) scale(0.2); opacity: 0; }
        50% { opacity: 1; }
        100% { transform: translate(-15px, -20px) scale(1.2); opacity: 0; }
      }
      @keyframes sparkBurst3 {
        0% { transform: translate(0, 0) scale(0.2); opacity: 0; }
        50% { opacity: 1; }
        100% { transform: translate(12px, 16px) scale(1.2); opacity: 0; }
      }

      /* Bug Color and Mood Morph (Glitch Red to Verified Green) */
      @keyframes bugTransform {
        0%, 45% { fill: #ff3366; }
        55%, 100% { fill: #42be65; }
      }

      @keyframes statusTextSwapA {
        0%, 45% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes statusTextSwapB {
        0%, 45% { opacity: 0; }
        50%, 100% { opacity: 1; }
      }

      .laser-weld { animation: weldBeam 1.2s ease-in-out infinite; }
      .spark-1 { transform-origin: 220px 85px; animation: sparkBurst1 0.8s ease-out infinite; }
      .spark-2 { transform-origin: 220px 85px; animation: sparkBurst2 0.9s ease-out infinite 0.2s; }
      .spark-3 { transform-origin: 220px 85px; animation: sparkBurst3 0.7s ease-out infinite 0.4s; }
      .bug-body { animation: bugTransform 6s ease-in-out infinite; }
      .text-bug-bad { animation: statusTextSwapA 6s ease-in-out infinite; }
      .text-bug-good { animation: statusTextSwapB 6s ease-in-out infinite; }

      @media (prefers-reduced-motion: reduce) {
        .laser-weld, .spark-1, .spark-2, .spark-3, .bug-body { animation: none; }
      }
    </style>

    <linearGradient id="beam-laser-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d2d3" />
      <stop offset="70%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#42be65" />
    </linearGradient>
  </defs>

  <!-- Container Box -->
  <rect width="800" height="160" rx="10" fill="#080c14" stroke="#1c283f" stroke-width="1.2" />

  <!-- Top Title Strip -->
  <rect width="800" height="26" rx="10" fill="#0d1527" />
  <rect x="0" y="16" width="800" height="10" fill="#0d1527" />
  <line x1="0" y1="26" x2="800" y2="26" stroke="#1c283f" stroke-width="1" />

  <text x="24" y="17" fill="#00d2d3" font-size="10" font-weight="700" class="font-mono" letter-spacing="1">🔧 REAL-TIME RUNTIME DEBUGGER // ZERO-LEAK CONDUIT</text>
  <text x="776" y="17" text-anchor="end" fill="#42be65" font-size="9.5" font-weight="700" class="font-mono">DEFECT RESOLUTION: 100% AUTOMATED</text>

  <!-- CONDUIT PIPE (X: 30 to X: 360, Y: 110) -->
  <g transform="translate(0, 0)">
    <rect x="30" y="105" width="340" height="14" rx="4" fill="#0d1527" stroke="#1c283f" stroke-width="1.2" />
    <line x1="30" y1="112" x2="370" y2="112" stroke="#00d2d3" stroke-width="1.8" stroke-dasharray="8 4" opacity="0.7" />
  </g>

  <!-- THE OPERATIVE WELDING / PATCHING (X: 110, Y: 60) -->
  <g transform="translate(100, 50)">
    <!-- Techwear Torso -->
    <rect x="10" y="20" width="18" height="22" rx="3" fill="#0d1527" stroke="#0f62fe" stroke-width="1.2" />
    <line x1="19" y1="22" x2="19" y2="38" stroke="#00d2d3" stroke-width="1.5" />
    
    <!-- Head and Visor -->
    <circle cx="19" cy="10" r="8" fill="#0d1527" stroke="#1c283f" stroke-width="1.2" />
    <rect x="15" y="8" width="9" height="4" rx="2" fill="#00d2d3" />

    <!-- Legs -->
    <rect x="11" y="42" width="5" height="14" rx="1.5" fill="#0f62fe" />
    <rect x="21" y="42" width="5" height="14" rx="1.5" fill="#0052cc" />

    <!-- Arms holding Laser Welder Torch -->
    <line x1="26" y1="26" x2="48" y2="34" stroke="#0f62fe" stroke-width="2.5" />
    <rect x="46" y="30" width="10" height="7" rx="2" fill="#1e293b" stroke="#00d2d3" stroke-width="0.8" />
    
    <!-- Laser Torch Tip and Welding Beam hitting the bug at (220, 85) -->
    <line x1="56" y1="34" x2="120" y2="35" stroke="url(#beam-laser-grad)" stroke-width="2.5" class="laser-weld" />
  </g>

  <!-- THE DIGITAL BUG (X: 220, Y: 75) -->
  <g transform="translate(220, 75)">
    <!-- Bug Body (Morphs between Red Glitch and Green Fixed) -->
    <ellipse cx="10" cy="10" rx="9" ry="7" class="bug-body" />
    <circle cx="6" cy="7" r="1.8" fill="#ffffff" />
    <circle cx="14" cy="7" r="1.8" fill="#ffffff" />
    <!-- Antennas -->
    <line x1="6" y1="4" x2="2" y2="-2" stroke="#1c283f" stroke-width="1.2" />
    <line x1="14" y1="4" x2="18" y2="-2" stroke="#1c283f" stroke-width="1.2" />
    <!-- Legs -->
    <line x1="3" y1="12" x2="-2" y2="18" stroke="#1c283f" stroke-width="1.2" />
    <line x1="17" y1="12" x2="22" y2="18" stroke="#1c283f" stroke-width="1.2" />

    <!-- Status Bubble over Bug -->
    <g class="text-bug-bad" transform="translate(-10, -22)">
      <rect width="46" height="14" rx="3" fill="#ff3366" />
      <text x="23" y="10" text-anchor="middle" fill="#ffffff" font-size="7" font-weight="900" class="font-mono">! BUG: LEAK</text>
    </g>
    <g class="text-bug-good" transform="translate(-14, -22)">
      <rect width="54" height="14" rx="3" fill="#42be65" />
      <text x="27" y="10" text-anchor="middle" fill="#080c14" font-size="7" font-weight="900" class="font-mono">and#10003; RESOLVED</text>
    </g>
  </g>

  <!-- WELDING SPARKS BURST -->
  <g class="spark-1" transform="translate(220, 85)">
    <circle cx="0" cy="0" r="1.5" fill="#00d2d3" />
  </g>
  <g class="spark-2" transform="translate(220, 85)">
    <circle cx="0" cy="0" r="1.8" fill="#ffffff" />
  </g>
  <g class="spark-3" transform="translate(220, 85)">
    <circle cx="0" cy="0" r="1.2" fill="#42be65" />
  </g>

  <!-- VERTICAL SEPARATOR -->
  <line x1="395" y1="36" x2="395" y2="145" stroke="#1c283f" stroke-width="1" stroke-dasharray="3 3" />

  <!-- RIGHT: REAL-TIME AUTOMATED CI/CD QUALITY MATRIX (X: 415, Y: 38) -->
  <g transform="translate(415, 38)">
    <rect width="360" height="106" rx="6" fill="#0d1527" stroke="#1c283f" stroke-width="1" />
    
    <text x="14" y="20" fill="#64748b" font-size="9.5" font-weight="700" class="font-mono">ENGINEERING STABILITY TELEMETRY</text>

    <!-- Metric 1 -->
    <g transform="translate(14, 30)">
      <text x="0" y="12" fill="#cbd5e1" font-size="9" class="font-mono">MEM LEAK PROTECTION:</text>
      <text x="160" y="12" fill="#42be65" font-size="9" font-weight="700" class="font-mono">0KB ALLOCATED / DETERMINISTIC</text>
    </g>

    <!-- Metric 2 -->
    <g transform="translate(14, 50)">
      <text x="0" y="12" fill="#cbd5e1" font-size="9" class="font-mono">STRICT TYPE COVERAGE:</text>
      <text x="160" y="12" fill="#00d2d3" font-size="9" font-weight="700" class="font-mono">100% TYPESCRIPT STRICT (NO ANY)</text>
    </g>

    <!-- Metric 3 -->
    <g transform="translate(14, 70)">
      <text x="0" y="12" fill="#cbd5e1" font-size="9" class="font-mono">TEST QUALITY SUITE:</text>
      <text x="160" y="12" fill="#4589ff" font-size="9" font-weight="700" class="font-mono">VITEST CONTINUOUS / 0 ERRORS</text>
    </g>
  </g>
</svg>
