<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="100%">
  <defs>
    <style>
      .font-mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }

      @keyframes termTypeA { 0% { opacity: 0; } 100% { opacity: 1; } }
      @keyframes termCursor { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }

      .t-1 { animation: termTypeA 0.3s ease forwards 0.2s; opacity: 0; }
      .t-2 { animation: termTypeA 0.3s ease forwards 0.5s; opacity: 0; }
      .t-3 { animation: termTypeA 0.3s ease forwards 0.8s; opacity: 0; }
      .t-4 { animation: termTypeA 0.3s ease forwards 1.1s; opacity: 0; }
      .t-5 { animation: termTypeA 0.3s ease forwards 1.4s; opacity: 0; }
      .t-6 { animation: termTypeA 0.3s ease forwards 1.7s; opacity: 0; }
      .t-7 { animation: termTypeA 0.3s ease forwards 2.0s; opacity: 0; }

      .cursor { animation: termCursor 0.8s infinite; }

      @media (prefers-reduced-motion: reduce) {
        .t-1, .t-2, .t-3, .t-4, .t-5, .t-6, .t-7 { animation: none; opacity: 1; }
        .cursor { animation: none; opacity: 1; }
      }
    </style>
  </defs>

  <!-- Terminal Chassis -->
  <rect width="800" height="200" rx="10" fill="#060910" stroke="#1c283f" stroke-width="1.5" />

  <!-- Top Title Bar -->
  <rect width="800" height="28" rx="10" fill="#0d1527" />
  <rect x="0" y="18" width="800" height="10" fill="#0d1527" />
  <line x1="0" y1="28" x2="800" y2="28" stroke="#1c283f" stroke-width="1" />

  <!-- Window Controls -->
  <circle cx="20" cy="14" r="3.8" fill="#ff5f56" />
  <circle cx="32" cy="14" r="3.8" fill="#ffbd2e" />
  <circle cx="44" cy="14" r="3.8" fill="#27c93f" />

  <text x="64" y="18" fill="#64748b" font-size="10.5" font-weight="600" class="font-mono">gabriel@crtooy-nexus: ~/projects (zsh)</text>
  <text x="776" y="18" text-anchor="end" fill="#42be65" font-size="9.5" font-weight="700" class="font-mono">SSH // 127.0.0.1:22 [AUTHENTICATED]</text>

  <!-- Terminal Body Lines -->
  <!-- Line 1: Command Prompt -->
  <g class="t-1">
    <text x="24" y="50" font-size="11" class="font-mono">
      <tspan fill="#00d2d3">gabriel@nexus</tspan>
      <tspan fill="#64748b">:</tspan>
      <tspan fill="#4589ff">~</tspan>
      <tspan fill="#f8fafc">$ </tspan>
      <tspan fill="#f8fafc" font-weight="700">crtooy --system-status --verbose</tspan>
    </text>
  </g>

  <!-- Line 2: Hypervisor -->
  <g class="t-2">
    <text x="24" y="70" font-size="10.5" class="font-mono">
      <tspan fill="#42be65">[✓] HYPERVISOR ...... </tspan>
      <tspan fill="#cbd5e1">CRTOOY KERNEL v4.0.0 (ONLINE)</tspan>
    </text>
  </g>

  <!-- Line 3: Trajectory -->
  <g class="t-3">
    <text x="24" y="90" font-size="10.5" class="font-mono">
      <tspan fill="#4589ff">[✓] TRAJECTORY ...... </tspan>
      <tspan fill="#cbd5e1">Apprentice @ </tspan>
      <tspan fill="#0f62fe" font-weight="700">IBM Brasil</tspan>
      <tspan fill="#cbd5e1"> &#8226; Systems &amp; Applied AI</tspan>
    </text>
  </g>

  <!-- Line 4: Core Toolset -->
  <g class="t-4">
    <text x="24" y="110" font-size="10.5" class="font-mono">
      <tspan fill="#a855f7">[✓] ACTIVE STACK .... </tspan>
      <tspan fill="#cbd5e1">TypeScript Strict &#8226; Node.js 22 &#8226; Kotlin &#8226; Three.js WebGL &#8226; Web Audio</tspan>
    </text>
  </g>

  <!-- Line 5: Repositories -->
  <g class="t-5">
    <text x="24" y="130" font-size="10.5" class="font-mono">
      <tspan fill="#ff9400">[✓] ACTIVE BUILDS ... </tspan>
      <tspan fill="#cbd5e1">crtooy (Web OS/CLI) &#8226; network-toolkit (SecOps) &#8226; Bodycam-FPS (3D)</tspan>
    </text>
  </g>

  <!-- Line 6: Quality Gate -->
  <g class="t-6">
    <text x="24" y="150" font-size="10.5" class="font-mono">
      <tspan fill="#00d2d3">[✓] DIAGNOSTICS ..... </tspan>
      <tspan fill="#cbd5e1">Memory: 0MB Bloat &#8226; Quality Gate: Vitest 100% Passing &#8226; Deterministic: TRUE</tspan>
    </text>
  </g>

  <!-- Line 7: Next Prompt with Blinking Cursor -->
  <g class="t-7">
    <text x="24" y="174" font-size="11" font-weight="700" class="font-mono">
      <tspan fill="#00d2d3">gabriel@nexus</tspan>
      <tspan fill="#64748b">:</tspan>
      <tspan fill="#4589ff">~</tspan>
      <tspan fill="#f8fafc">$ </tspan>
      <tspan fill="#42be65">npx crtooy</tspan>
      <tspan fill="#00d2d3" class="cursor"> █</tspan>
    </text>
  </g>
</svg>
