<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="100%" height="100%">
  <defs>
    <style>
      .font-mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, Courier, monospace; }
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

      @keyframes satelliteOrbit1 {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      @keyframes packetPulseAlongTrack {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -160; }
      }

      @keyframes nodePingGlow {
        0%, 100% { r: 4; opacity: 0.8; }
        50% { r: 8; opacity: 1; filter: drop-shadow(0 0 6px #00d2d3); }
      }

      @keyframes globeGridRotate {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -200; }
      }

      .sat-1 { transform-origin: 150px 135px; animation: satelliteOrbit1 8s linear infinite; }
      .data-route { stroke-dasharray: 6 4; animation: packetPulseAlongTrack 2.5s linear infinite; }
      .ping-sp { animation: nodePingGlow 2s ease-in-out infinite; }
      .ping-node { animation: nodePingGlow 2.5s ease-in-out infinite 0.6s; }

      @media (prefers-reduced-motion: reduce) {
        .sat-1, .data-route, .ping-sp, .ping-node { animation: none; }
      }
    </style>

    <radialGradient id="globe-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0f62fe" stop-opacity="0.25" />
      <stop offset="70%" stop-color="#00d2d3" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#080c14" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="beam-saopaulo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d2d3" />
      <stop offset="50%" stop-color="#4589ff" />
      <stop offset="100%" stop-color="#42be65" />
    </linearGradient>
  </defs>

  <!-- Container Box -->
  <rect width="800" height="240" rx="12" fill="#080c14" stroke="#1c283f" stroke-width="1.5" />

  <!-- Top Header Strip -->
  <rect width="800" height="32" rx="12" fill="#0d1527" />
  <rect x="0" y="22" width="800" height="10" fill="#0d1527" />
  <line x1="0" y1="32" x2="800" y2="32" stroke="#1c283f" stroke-width="1" />

  <g transform="translate(24, 21)">
    <circle cx="6" cy="0" r="4" fill="#00d2d3" />
    <text x="18" y="4" fill="#00d2d3" font-size="11" font-weight="700" class="font-mono" letter-spacing="1">🌐 GLOBAL ORBITAL RELAY // SÃO PAULO LATAM TO GLOBAL NODES</text>
  </g>
  <text x="776" y="21" text-anchor="end" fill="#42be65" font-size="10" font-weight="700" class="font-mono">GEO-LINK: LATENCY 0.42ms // ACTIVE</text>

  <!-- LEFT: 3D HOLOGRAPHIC GLOBE and ORBITING RELAY (Center: 150, 135) -->
  <g>
    <!-- Globe Core Glow -->
    <circle cx="150" cy="135" r="75" fill="url(#globe-core)" stroke="#1c283f" stroke-width="1.5" />
    
    <!-- Geodesic Longitude / Latitude Rings -->
    <ellipse cx="150" cy="135" rx="75" ry="30" fill="none" stroke="#1c283f" stroke-width="0.8" stroke-dasharray="3 3" />
    <ellipse cx="150" cy="135" rx="75" ry="60" fill="none" stroke="#1c283f" stroke-width="0.8" stroke-dasharray="4 3" />
    <line x1="75" y1="135" x2="225" y2="135" stroke="#1c283f" stroke-width="1" />
    <line x1="150" y1="60" x2="150" y2="210" stroke="#1c283f" stroke-width="1" />

    <!-- Stylized South America Continent Vector Silhouette (São Paulo marked) -->
    <path d="M 120 110 Q 145 105, 160 120 T 155 160 T 135 185 T 125 150 Z" fill="#0f62fe" fill-opacity="0.2" stroke="#0f62fe" stroke-width="1" />
    
    <!-- SÃO PAULO BASE HQ NODE (148, 158) -->
    <circle cx="148" cy="158" r="4" fill="#00d2d3" class="ping-sp" />
    <circle cx="148" cy="158" r="8" fill="none" stroke="#00d2d3" stroke-width="1" opacity="0.6" />
    <text x="148" y="174" text-anchor="middle" fill="#00d2d3" font-size="7.5" font-weight="700" class="font-mono">SÃO PAULO [HQ]</text>

    <!-- Satellite Orbiting Ring -->
    <ellipse cx="150" cy="135" rx="88" ry="38" fill="none" stroke="#00d2d3" stroke-width="0.8" stroke-dasharray="4 3" opacity="0.4" transform="rotate(-25 150 135)" />

    <!-- Orbiting Satellite Component -->
    <g class="sat-1">
      <g transform="translate(238, 135)">
        <rect x="-4" y="-3" width="8" height="6" rx="1" fill="#cbd5e1" />
        <!-- Solar Panels -->
        <line x1="-12" y1="0" x2="-4" y2="0" stroke="#00d2d3" stroke-width="2.5" />
        <line x1="4" y1="0" x2="12" y2="0" stroke="#00d2d3" stroke-width="2.5" />
        <circle cx="0" cy="0" r="1.5" fill="#42be65" />
      </g>
    </g>
  </g>

  <!-- VERTICAL SEPARATOR -->
  <line x1="285" y1="32" x2="285" y2="240" stroke="#1c283f" stroke-width="1" />

  <!-- RIGHT: GLOBAL NODE CONNECTIONS and TELEMETRY LIST -->
  <g transform="translate(305, 46)">
    
    <!-- NODE 1: SÃO PAULO BR (PRIMARY BASE) -->
    <g transform="translate(0, 0)">
      <rect width="470" height="40" rx="6" fill="#0d1527" stroke="#1c283f" stroke-width="1" />
      <rect x="0" y="0" width="4" height="40" rx="2" fill="#00d2d3" />
      <circle cx="18" cy="20" r="4" fill="#00d2d3" class="ping-sp" />
      
      <text x="30" y="16" fill="#f8fafc" font-size="10.5" font-weight="700" class="font-mono">NODE 01: SÃO PAULO, BR [LATAM HEADQUARTERS]</text>
      <text x="390" y="16" fill="#00d2d3" font-size="9" font-weight="700" class="font-mono">LOCAL CORE</text>
      <text x="30" y="31" fill="#94a3b8" font-size="9" class="font-mono">IBM Brasil Apprentice Core &#8226; CRTOOY Labs Kernel &#8226; Strict TS Runtimes</text>
    </g>

    <!-- NODE 2: NEW YORK / ARMONK (IBM QUANTUM LINK) -->
    <g transform="translate(0, 46)">
      <rect width="470" height="40" rx="6" fill="#0d1527" stroke="#1c283f" stroke-width="1" />
      <rect x="0" y="0" width="4" height="40" rx="2" fill="#0f62fe" />
      <circle cx="18" cy="20" r="4" fill="#0f62fe" class="ping-node" />
      
      <text x="30" y="16" fill="#f8fafc" font-size="10.5" font-weight="700" class="font-mono">NODE 02: ARMONK, NY [IBM CLOUD and QUANTUM NETWORK]</text>
      <text x="395" y="16" fill="#0f62fe" font-size="9" font-weight="700" class="font-mono">ENTERPRISE</text>
      <text x="30" y="31" fill="#94a3b8" font-size="9" class="font-mono">Enterprise Workflows &#8226; Hybrid Cloud Architectures &#8226; Systems Security</text>
    </g>

    <!-- NODE 3: SAN FRANCISCO (OPEN SOURCE NEXUS) -->
    <g transform="translate(0, 92)">
      <rect width="470" height="40" rx="6" fill="#0d1527" stroke="#1c283f" stroke-width="1" />
      <rect x="0" y="0" width="4" height="40" rx="2" fill="#42be65" />
      <circle cx="18" cy="20" r="4" fill="#42be65" class="ping-node" />
      
      <text x="30" y="16" fill="#f8fafc" font-size="10.5" font-weight="700" class="font-mono">NODE 03: SAN FRANCISCO, CA [OPEN SOURCE NEXUS]</text>
      <text x="400" y="16" fill="#42be65" font-size="9" font-weight="700" class="font-mono">GITHUB LIVE</text>
      <text x="30" y="31" fill="#94a3b8" font-size="9" class="font-mono">Continuous Deployment &#8226; NPM CLI Packages (npx crtooy) &#8226; GitHub Pages</text>
    </g>

    <!-- NODE 4: TOKYO (HIGH-SPEED EDGE GATEWAY) -->
    <g transform="translate(0, 138)">
      <rect width="470" height="40" rx="6" fill="#0d1527" stroke="#1c283f" stroke-width="1" />
      <rect x="0" y="0" width="4" height="40" rx="2" fill="#a855f7" />
      <circle cx="18" cy="20" r="4" fill="#a855f7" class="ping-node" />
      
      <text x="30" y="16" fill="#f8fafc" font-size="10.5" font-weight="700" class="font-mono">NODE 04: TOKYO, JP [HIGH-SPEED EDGE and PWA SYNCHRONY]</text>
      <text x="395" y="16" fill="#a855f7" font-size="9" font-weight="700" class="font-mono">EDGE RUNTIME</text>
      <text x="30" y="31" fill="#94a3b8" font-size="9" class="font-mono">Sub-millisecond PWA Service Workers &#8226; Web Audio 96kHz Low-Latency DSP</text>
    </g>
  </g>
</svg>
